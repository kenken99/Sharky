// Scale canvas to fit window
function resizeCanvas() {
  const scale = Math.min(window.innerWidth / GW, window.innerHeight / GH) * 0.95;
  canvas.style.width = (GW * scale) + 'px';
  canvas.style.height = (GH * scale) + 'px';
}

// ============================================================
//  AUDIO ENGINE (Web Audio API)
// ============================================================
let audioCtx = null;
let masterGain = null;
let musicGain = null;
let sfxGain = null;

function initAudio() {
  if (audioCtx) { audioCtx.resume(); return; }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.5;
  masterGain.connect(audioCtx.destination);
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 0.3;
  musicGain.connect(masterGain);
  sfxGain = audioCtx.createGain();
  sfxGain.gain.value = 0.6;
  sfxGain.connect(masterGain);
}

function playNote(freq, duration, type = 'square', gainNode = sfxGain, vol = 0.3, detune = 0) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.detune.value = detune;
  g.gain.setValueAtTime(vol, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(g);
  g.connect(gainNode);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + duration);
}

function playNoteAt(freq, startTime, duration, type = 'square', gainNode = musicGain, vol = 0.15) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(vol, startTime + 0.02);
  g.gain.setValueAtTime(vol, startTime + duration - 0.05);
  g.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.connect(g);
  g.connect(gainNode);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.05);
  if (gainNode === musicGain) {
    activeMusicNodes.push({ osc, gain: g });
  }
}

function playMusicLoop(melody, bass, type = 'happy') {
  if (!audioCtx || !musicPlaying) return;
  const now = audioCtx.currentTime + 0.05;
  let melodyTime = now;
  melody.forEach(([note, dur]) => {
    if (NOTE_FREQS[note]) {
      playNoteAt(NOTE_FREQS[note], melodyTime, dur * 0.9, 'square', musicGain, type === 'shark' ? 0.18 : 0.12);
    }
    melodyTime += dur;
  });
  let bassTime = now;
  bass.forEach(([note, dur]) => {
    if (NOTE_FREQS[note]) {
      playNoteAt(NOTE_FREQS[note], bassTime, dur * 0.85, 'triangle', musicGain, type === 'shark' ? 0.12 : 0.08);
    }
    bassTime += dur;
  });
  const loopDuration = Math.max(melodyTime, bassTime) - now;
  musicTimeout = setTimeout(() => {
    if (musicPlaying) {
      if (currentMusic === 'shark') {
        playMusicLoop(SHARK_MELODY, SHARK_BASS, 'shark');
      } else {
        const s = SHANTIES[currentShantyIndex % SHANTIES.length];
        playMusicLoop(s.melody, s.bass, 'happy');
      }
    }
  }, loopDuration * 1000 - 50);
}

function startMusic(type = 'happy') {
  if (currentMusic === type && musicPlaying) return;
  stopMusic();
  currentMusic = type;
  musicPlaying = true;
  if (musicGain) musicGain.gain.value = musicEnabled ? 0.3 : 0;
  if (type === 'shark') {
    playMusicLoop(SHARK_MELODY, SHARK_BASS, 'shark');
  } else {
    const s = SHANTIES[currentShantyIndex % SHANTIES.length];
    playMusicLoop(s.melody, s.bass, 'happy');
  }
}

function stopMusic() {
  musicPlaying = false;
  if (musicTimeout) {
    clearTimeout(musicTimeout);
    musicTimeout = null;
  }
  // Stop all scheduled music oscillators immediately
  activeMusicNodes.forEach(({ osc, gain }) => {
    try {
      gain.gain.cancelScheduledValues(0);
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.01);
    } catch(e) {} // ignore if already stopped
  });
  activeMusicNodes = [];
  currentMusic = null;
}

function toggleMusic() {
  musicEnabled = !musicEnabled;
  if (!musicEnabled) {
    if (musicGain) musicGain.gain.value = 0;
  } else {
    if (musicGain) musicGain.gain.value = 0.3;
    if (!musicPlaying) {
      const type = currentMusic || (sharkActive ? 'shark' : 'happy');
      currentMusic = null;
      startMusic(type);
    }
  }
}

// ============================================================
//  PIXEL ART SPRITE SYSTEM
// ============================================================
// Sprite cache. Bounded: enemy sprites are keyed by type/colour/shape/frame/facing,
// so an unbounded cache would keep growing as new combinations spawn. The live working
// set (player + shark + on-screen enemies) is far below the limit, so evictions are rare.
const SPRITE_CACHE_LIMIT = 1024;
const spriteCache = new Map();

function cacheSprite(key, canvas) {
  if (spriteCache.size >= SPRITE_CACHE_LIMIT) {
    spriteCache.delete(spriteCache.keys().next().value); // oldest insertion
  }
  spriteCache.set(key, canvas);
  return canvas;
}

// Sprites are pre-rendered per animation-cycle position, so every wag/mouth cycle has to
// close exactly over its cycle length or the sprite would visibly pop as the loop wraps.
const TAU = Math.PI * 2;
const PLAYER_ANIM_FRAMES = 24;
const ENEMY_ANIM_FRAMES = 8;
const SHARK_ANIM_FRAMES = 16;
const EEL_ANIM_FRAMES = 8;
const STAR_ANIM_FRAMES = 24;

function drawPixel(cx, x, y, color, size = 1) {
  cx.fillStyle = color;
  cx.fillRect(x * size, y * size, size, size);
}

// Deterministic per-pixel noise for mottling and ossicle bumps. Sprites are cached,
// so they must never use Math.random() — the same key has to draw the same pixels.
function spriteHash(x, y, seed) {
  let n = (x * 374761393 + y * 668265263 + (seed || 0) * 1442695041) | 0;
  n = (n ^ (n >> 13)) | 0;
  n = (n * 1274126177) | 0;
  return ((n ^ (n >> 16)) >>> 0) / 4294967296;
}

// Shared fish eye: dark rim, amber iris, black pupil on the leading side, one glint.
// eyeI/eyeY are in nose-to-tail index space; sx() applies the facing mirror.
function drawFishEye(cx, ps, W, H, sx, eyeI, eyeY, rim, iris) {
  const n = W >= 40 ? 5 : (W >= 24 ? 4 : 2);
  const o = Math.floor(n / 2);
  for (let ox = 0; ox < n; ox++) {
    for (let oy = 0; oy < n; oy++) {
      const gy = eyeY - o + oy;
      if (gy < 0 || gy >= H) continue;
      let col;
      if (n === 2) col = (ox === 1 && oy === 0) ? iris : '#0B0A10';
      else if (ox === 0 || oy === 0 || ox === n - 1 || oy === n - 1) col = rim;
      else col = (ox <= o) ? '#0B0A10' : iris;
      drawPixel(cx, sx(eyeI - o + ox), gy, col, ps);
    }
  }
  if (n >= 4) {
    const gl = eyeY - o + 1;
    if (gl >= 0 && gl < H) drawPixel(cx, sx(eyeI - o + n - 2), gl, '#FFFFFF', ps);
  }
}

// Player fish sprites at different sizes
const PLAYER_SIZES = [
  { w: 16, h: 10 },
  { w: 20, h: 13 },
  { w: 26, h: 16 },
  { w: 32, h: 20 },
  { w: 40, h: 24 },
  { w: 48, h: 28 },
];

// Five tones plus an outline per size level: highlight, light, mid, dark, outline,
// with a belly pair. Nothing in a sprite samples a colour outside its own ramp.
const PLAYER_PALETTES = [
  { hi: '#FFF6D2', lt: '#FFD84D', md: '#EFA31F', dk: '#B96C0E', out: '#5F3105', belly: '#FFF3DA', bshad: '#EAD3A0' }, // gold tiny
  { hi: '#FFEDC0', lt: '#FFC13C', md: '#EE8720', dk: '#B4550E', out: '#582509', belly: '#FFEDD2', bshad: '#E7C79A' }, // amber
  { hi: '#FFDCB6', lt: '#FF9A4A', md: '#EF6122', dk: '#B03810', out: '#521808', belly: '#FFE5CB', bshad: '#E8BC95' }, // orange
  { hi: '#FFCBB6', lt: '#FF7454', md: '#E63D1E', dk: '#A72310', out: '#4D0F08', belly: '#FFDACA', bshad: '#E7AF98' }, // vermilion
  { hi: '#FFBBB8', lt: '#F2544F', md: '#C42220', dk: '#8B1014', out: '#420409', belly: '#FFD0CC', bshad: '#E4A29E' }, // crimson
  { hi: '#FFC0E4', lt: '#FF5CA8', md: '#D92176', dk: '#98114F', out: '#450627', belly: '#FFD6EC', bshad: '#E9A3C4' }, // hot pink champion
];
const FISH_IRIS = '#D8981F';

// Body profile: blunt snout, deepest at 34% of body length, long taper into a
// narrow caudal peduncle. Returns the half-height as a fraction of hh.
function playerProfile(t) {
  if (t < 0.12) return Math.pow(t / 0.12, 0.60) * 0.60;
  if (t < 0.36) return 0.60 + ((t - 0.12) / 0.24) * 0.40;
  return 1.0 - Math.pow((t - 0.36) / 0.64, 0.92) * 0.84;
}

function createPlayerFish(sizeLevel, frame, facingLeft) {
  const s = PLAYER_SIZES[sizeLevel] || PLAYER_SIZES[0];
  const ps = 2;
  const af = frame % PLAYER_ANIM_FRAMES; // bounded animation frame => bounded cache
  const key = `player_${sizeLevel}_${af}_${facingLeft}`;
  const cached = spriteCache.get(key);
  if (cached) return cached;

  const c = document.createElement('canvas');
  c.width = s.w * ps;
  c.height = s.h * ps;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;

  const W = s.w, H = s.h, hh = Math.floor(H / 2);
  const P = PLAYER_PALETTES[sizeLevel] || PLAYER_PALETTES[0];
  const big = W >= 26;
  const bodyEnd = Math.floor(W * 0.76); // the rest of the width is caudal fin

  // Travelling wave down the centreline — amplitude grows toward the tail, so the
  // fish swims rather than shakes. Two beats per cycle, closing exactly on the loop.
  const phase = af * (TAU / PLAYER_ANIM_FRAMES) * 2;
  const amp = Math.max(1, H * 0.075);
  const bend = (t) => Math.sin(phase - t * 2.6) * amp * Math.pow(t, 1.5);
  const sx = (i) => (facingLeft ? i : W - 1 - i); // nose-to-tail index -> screen x
  const cyAt = (t) => hh + bend(t);

  // === PASS 1: body, countershaded along the body normal ===
  for (let i = 0; i < bodyEnd; i++) {
    const t = i / bodyEnd;
    const halfI = Math.floor(playerProfile(t) * hh);
    if (halfI < 1) continue;
    const cy = cyAt(t);
    const X = sx(i);
    const specDy = -Math.round(halfI * 0.50); // one-pixel specular ridge
    for (let dy = -halfI; dy <= halfI; dy++) {
      const y = Math.round(cy + dy);
      if (y < 0 || y >= H) continue;
      const ny = dy / halfI; // -1 dorsal, +1 ventral
      let col;
      if (dy === -halfI || dy === halfI || t < 0.035) col = P.out;
      else if (ny < -0.55) col = P.dk;
      else if (ny < -0.08) col = P.md;
      else if (ny < 0.30) col = P.lt;
      else if (ny < 0.66) col = P.belly;
      else col = P.bshad;
      if (col !== P.out && halfI > 2 && dy === specDy && t > 0.14 && t < 0.58) col = P.hi;
      drawPixel(cx, X, y, col, ps);
    }
    // Lateral line: dashed, just below the midline
    if (t > 0.28 && t < 0.95 && i % 2 === 0 && halfI > 2) {
      const ly = Math.round(cy + Math.max(1, Math.round(halfI * 0.10)));
      if (ly > 0 && ly < H) drawPixel(cx, X, ly, P.dk, ps);
    }
  }

  // === PASS 2: gill cover ===
  if (big) {
    const gt = 0.24;
    const gHalf = Math.floor(playerProfile(gt) * hh);
    const gcy = cyAt(gt);
    for (let gd = -Math.floor(gHalf * 0.72); gd <= Math.floor(gHalf * 0.18); gd++) {
      const gn = gd / Math.max(1, gHalf);
      const gy = Math.round(gcy + gd);
      if (gy > 0 && gy < H) {
        drawPixel(cx, sx(Math.round(gt * bodyEnd + gn * gn * 3.0)), gy, P.dk, ps);
      }
    }
  }

  // === PASS 3: dorsal fin, with ray striations ===
  const d0 = 0.32, d1 = 0.62;
  const dMax = Math.max(2, Math.round(H * 0.30));
  for (let t2 = d0; t2 < d1; t2 += 1 / bodyEnd) {
    const u = (t2 - d0) / (d1 - d0);
    const fh = Math.round(dMax * Math.sin(Math.pow(u, 0.72) * Math.PI));
    if (fh < 1) continue;
    const bi = Math.round(t2 * bodyEnd);
    const bY = Math.round(cyAt(t2) - playerProfile(t2) * hh);
    for (let k = 0; k < fh; k++) {
      const yy = bY - k;
      if (yy < 0) continue;
      drawPixel(cx, sx(bi), yy, k === fh - 1 ? P.out : (bi % 2 === 0 ? P.md : P.dk), ps);
    }
  }

  // === PASS 4: anal fin ===
  if (big) {
    const a0 = 0.60, a1 = 0.78;
    const aMax = Math.max(2, Math.round(H * 0.16));
    for (let t3 = a0; t3 < a1; t3 += 1 / bodyEnd) {
      const u3 = (t3 - a0) / (a1 - a0);
      const ah = Math.round(aMax * Math.sin(Math.pow(u3, 0.7) * Math.PI));
      const ai = Math.round(t3 * bodyEnd);
      const aY = Math.round(cyAt(t3) + playerProfile(t3) * hh);
      for (let k3 = 0; k3 < ah; k3++) {
        const ay = aY + k3;
        if (ay >= H) continue;
        drawPixel(cx, sx(ai), ay, k3 === ah - 1 ? P.out : (ai % 2 === 0 ? P.md : P.dk), ps);
      }
    }
  }

  // === PASS 5: pectoral fin, hinged at the gill cover and swept back ===
  const pt = 0.30;
  const pLen = Math.max(3, Math.round(W * 0.17));
  const pBaseI = Math.round(pt * bodyEnd);
  const pBaseY = Math.round(cyAt(pt) + playerProfile(pt) * hh * 0.42);
  const pFlap = Math.sin(phase * 0.5) * 0.6;
  for (let pk = 0; pk < pLen; pk++) {
    const pu = pk / pLen;
    const pI = pBaseI + pk;
    const pY = Math.round(pBaseY + pk * (0.62 + pFlap * 0.12));
    const thick = Math.max(1, Math.round((1 - pu) * 3));
    for (let q = 0; q < thick; q++) {
      const yv = pY - q;
      if (yv < 0 || yv >= H) continue;
      drawPixel(cx, sx(pI), yv, (q === thick - 1 && pk > 0) ? P.lt : (pk % 2 === 0 ? P.md : P.dk), ps);
    }
    if (pY + 1 < H) drawPixel(cx, sx(pI), pY + 1, P.out, ps);
  }

  // === PASS 6: caudal fin — forked, notched, ray-striated ===
  const tailLen = W - bodyEnd;
  const tcy = cyAt(1.0);
  const pedHalf = Math.max(1, Math.floor(playerProfile(1.0) * hh));
  const maxSpread = Math.max(2, Math.round(hh * 0.96));
  const minLen = Math.max(1, tailLen * 0.42);
  for (let ti = 0; ti < tailLen; ti++) {
    const tu = (ti + 1) / tailLen;
    const spread = Math.round(pedHalf + (maxSpread - pedHalf) * Math.pow(tu, 0.70));
    const TX = sx(bodyEnd + ti);
    for (let td = -spread; td <= spread; td++) {
      // Fin length grows toward the lobe tips, which cuts the fork notch
      const v = Math.abs(td) / Math.max(1, maxSpread);
      const L = minLen + (tailLen - minLen) * Math.pow(v, 0.80);
      if (ti + 1 > L) continue;
      const ty = Math.round(tcy + td);
      if (ty < 0 || ty >= H) continue;
      const ray = Math.round(Math.abs(td) * 0.75);
      const edge = Math.abs(td) === spread || ti + 1 > L - 1;
      drawPixel(cx, TX, ty, edge ? P.out : (ray % 2 === 0 ? P.md : P.dk), ps);
    }
  }

  // === PASS 7: eye ===
  const et = 0.165;
  const eI = Math.round(et * bodyEnd);
  const eY = Math.round(cyAt(et) - playerProfile(et) * hh * 0.30);
  drawFishEye(cx, ps, W, H, sx, eI, eY, P.out, FISH_IRIS);

  // === PASS 8: jaw notch, open on the first half of the cycle ===
  const open = af < PLAYER_ANIM_FRAMES / 2 ? 1 : 0;
  const jawY = Math.round(cyAt(0.045) + playerProfile(0.045) * hh * 0.34);
  for (let mi = 0; mi < (big ? 3 : 2); mi++) {
    const my = jawY + (mi === 0 ? open : 0);
    if (my > 0 && my < H) drawPixel(cx, sx(1 + mi), my, P.out, ps);
  }
  if (open && big) {
    drawPixel(cx, sx(1), jawY + 1, '#6E1A16', ps);
    drawPixel(cx, sx(2), jawY + 1, '#6E1A16', ps);
  }

  return cacheSprite(key, c);
}

// Color palettes: highlight, body, shadow, outline (4-tone shading)
// Colour palettes: five tones plus an outline, with a belly pair. `md` is the
// fish's identifying hue (used for eat particles); `hi` is the specular ridge only.
const FISH_PALETTES = [
  { hi: '#D6F5C2', lt: '#79D45C', md: '#3FA13A', dk: '#226B27', out: '#0E3315', belly: '#EAF7D8', bshad: '#B8D6A1' }, // green
  { hi: '#C6E4FF', lt: '#5CA6E8', md: '#2F6FBF', dk: '#1B4382', out: '#0B1F44', belly: '#E2F0FF', bshad: '#AEC7E3' }, // blue
  { hi: '#FFD2E2', lt: '#F2749F', md: '#C93D70', dk: '#8C2149', out: '#440E24', belly: '#FFE6EF', bshad: '#E2B4C6' }, // pink
  { hi: '#FFF3C4', lt: '#F2D050', md: '#C39A18', dk: '#856608', out: '#3C2C04', belly: '#FFF7DC', bshad: '#E0CE9A' }, // yellow
  { hi: '#C4F6E6', lt: '#4CCBAB', md: '#219079', dk: '#0F5F4E', out: '#062E26', belly: '#DDFAF1', bshad: '#A8D6C9' }, // teal
  { hi: '#FFDCBC', lt: '#F2953F', md: '#C45F14', dk: '#8A3A08', out: '#3E1904', belly: '#FFEBD6', bshad: '#E3C09A' }, // orange
  { hi: '#E2CDFF', lt: '#9E6FE0', md: '#6A3CB0', dk: '#452276', out: '#1F0E39', belly: '#EFE4FF', bshad: '#C3AEDF' }, // purple
  { hi: '#FFC7C0', lt: '#E4574C', md: '#B02A24', dk: '#761413', out: '#360607', belly: '#FFDBD4', bshad: '#E1AAA2' }, // red
  { hi: '#C2F2F7', lt: '#46BFD1', md: '#1D8698', dk: '#0D5765', out: '#052A33', belly: '#DDF6FA', bshad: '#A6D2DA' }, // cyan
  { hi: '#EFD6BA', lt: '#C79463', md: '#95633A', dk: '#653F20', out: '#2E1A0C', belly: '#F6E7D3', bshad: '#D2BB9E' }, // brown
  { hi: '#F7D4F2', lt: '#D274C8', md: '#A03E96', dk: '#6C2364', out: '#320F2E', belly: '#FBE6F8', bshad: '#DCB6D6' }, // magenta
  { hi: '#DEF0BE', lt: '#9BC062', md: '#6B8D34', dk: '#455E1B', out: '#1E2C0A', belly: '#EDF6D9', bshad: '#C6D5A4' }, // olive
];

// Fish body shapes for variety
const FISH_SHAPES = ['normal', 'round', 'sleek', 'tall'];

// Markings, chosen independently of the silhouette. patternIdx encodes both:
// shape = patternIdx % FISH_SHAPES.length, pattern = (patternIdx / 4) | 0.
const FISH_PATTERNS = ['plain', 'bars', 'stripe', 'spots', 'saddle'];
const FISH_MORPH_COUNT = 20; // FISH_SHAPES.length * FISH_PATTERNS.length

// Sprite size definitions per size level (pixel dimensions before ps multiply)
const FISH_SIZE_DEFS = [
  { w: 10, h: 6  }, // size 0: tiny
  { w: 14, h: 10 }, // size 1: small
  { w: 20, h: 13 }, // size 2: medium
  { w: 27, h: 17 }, // size 3: large
  { w: 36, h: 22 }, // size 4: huge
  { w: 43, h: 25 }, // size 5: giant
  { w: 50, h: 29 }, // size 6: colossal
];

// Enemy fish with proper pixel art anatomy
// Enemy fish. patternIdx carries two independent axes: silhouette and markings,
// so FISH_SHAPES.length * FISH_PATTERNS.length distinct morphs come out of one factory.
function createEnemyFish(type, frame, facingLeft, colorIdx, patternIdx) {
  const sizeDef = FISH_SIZE_DEFS[type] || FISH_SIZE_DEFS[0];
  const P = FISH_PALETTES[colorIdx % FISH_PALETTES.length];
  const shape = FISH_SHAPES[patternIdx % FISH_SHAPES.length];
  const pattern = FISH_PATTERNS[Math.floor(patternIdx / FISH_SHAPES.length) % FISH_PATTERNS.length];
  const ps = 2;
  const af = frame % ENEMY_ANIM_FRAMES;
  const key = `enemy_${type}_${colorIdx}_${patternIdx}_${af}_${facingLeft}`;
  const cached = spriteCache.get(key);
  if (cached) return { canvas: cached, w: sizeDef.w * ps, h: sizeDef.h * ps };

  const c = document.createElement('canvas');
  c.width = sizeDef.w * ps;
  c.height = sizeDef.h * ps;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;

  const W = sizeDef.w, H = sizeDef.h, hh = Math.floor(H / 2);

  // Body profile: half-height as a fraction of hh, t from 0 (snout) to 1 (peduncle)
  function profile(t) {
    let h, p;
    if (shape === 'round') {          // pufferfish-like
      p = 0.42;
      h = t < p ? Math.pow(t / p, 0.55) * 1.0 : 1.0 - Math.pow((t - p) / (1 - p), 1.05) * 0.82;
    } else if (shape === 'sleek') {   // tuna-like
      p = 0.30;
      h = t < p ? Math.pow(t / p, 0.55) * 0.74 : 0.74 - Math.pow((t - p) / (1 - p), 0.95) * 0.60;
    } else if (shape === 'tall') {    // angelfish-like
      p = 0.42;
      h = t < p ? Math.pow(t / p, 0.62) * 1.0 : 1.0 - Math.pow((t - p) / (1 - p), 0.80) * 0.86;
    } else {                          // normal teardrop
      p = 0.36;
      h = t < p ? Math.pow(t / p, 0.58) * 0.90 : 0.90 - Math.pow((t - p) / (1 - p), 0.92) * 0.74;
    }
    if (t < 0.10) h *= 0.45 + 0.55 * (t / 0.10); // blunt the snout
    return Math.max(0.05, h);
  }

  const bodyEnd = Math.floor(W * 0.76);
  const phase = af * (TAU / ENEMY_ANIM_FRAMES);
  const amp = Math.max(0.8, H * 0.07);
  const bend = (t) => Math.sin(phase - t * 2.4) * amp * Math.pow(t, 1.5);
  const sx = (i) => (facingLeft ? i : W - 1 - i);
  const cyAt = (t) => hh + bend(t);
  const big = type >= 2, mid = type >= 1;

  // === PASS 1: body, countershading + markings ===
  for (let i = 0; i < bodyEnd; i++) {
    const t = i / bodyEnd;
    const halfI = Math.floor(profile(t) * hh);
    if (halfI < 1) continue;
    const cy = cyAt(t);
    const X = sx(i);
    const specDy = -Math.round(halfI * 0.50);
    for (let dy = -halfI; dy <= halfI; dy++) {
      const y = Math.round(cy + dy);
      if (y < 0 || y >= H) continue;
      const ny = dy / halfI;
      let col;
      if (dy === -halfI || dy === halfI || t < 0.03) col = P.out;
      else if (ny < -0.56) col = P.dk;
      else if (ny < -0.06) col = P.md;
      else if (ny < 0.32) col = P.lt;
      else if (ny < 0.68) col = P.belly;
      else col = P.bshad;

      // Markings, applied inside the outline only
      if (col !== P.out && Math.abs(ny) < 0.80) {
        if (pattern === 'bars') {
          const bt = Math.round(i + ny * ny * ny * 3.0 + ny * 1.6); // curves with the body
          if (((bt % 7) + 7) % 7 < 2) col = ny < -0.1 ? P.dk : P.md;
        } else if (pattern === 'stripe') {
          if (ny > -0.30 && ny < 0.02) col = P.dk;
          else if (ny >= 0.02 && ny < 0.14) col = P.hi;
        } else if (pattern === 'spots') {
          if (spriteHash(Math.floor(i / 3), Math.floor((dy + halfI) / 3), type + colorIdx) > 0.62) {
            col = ny < 0.2 ? P.dk : P.md;
          }
        } else if (pattern === 'saddle') {
          if (t > 0.26 && t < 0.52 && ny < 0.18) col = P.dk;
          else if (t >= 0.52 && t < 0.60 && ny < -0.30) col = P.dk;
        }
      }
      if (col !== P.out && halfI > 2 && dy === specDy && t > 0.13 && t < 0.60) col = P.hi;
      drawPixel(cx, X, y, col, ps);
    }
    // Lateral line
    if (mid && t > 0.30 && t < 0.94 && i % 2 === 0 && halfI > 2) {
      const ly = Math.round(cy + Math.max(1, Math.round(halfI * 0.08)));
      if (ly > 0 && ly < H) drawPixel(cx, X, ly, P.dk, ps);
    }
  }

  // === PASS 2: gill cover ===
  if (mid) {
    const gt = 0.23;
    const gH = Math.floor(profile(gt) * hh);
    const gcy = cyAt(gt);
    for (let gd = -Math.floor(gH * 0.70); gd <= Math.floor(gH * 0.18); gd++) {
      const gn = gd / Math.max(1, gH);
      const gy = Math.round(gcy + gd);
      if (gy > 0 && gy < H) drawPixel(cx, sx(Math.round(gt * bodyEnd + gn * gn * 2.6)), gy, P.dk, ps);
    }
  }

  // === PASS 3: dorsal fin ===
  const d0 = shape === 'tall' ? 0.28 : 0.32;
  const d1 = shape === 'sleek' ? 0.54 : 0.62;
  const dMax = Math.max(2, Math.round(H * (shape === 'tall' ? 0.34 : 0.26)));
  for (let t2 = d0; t2 < d1; t2 += 1 / bodyEnd) {
    const u = (t2 - d0) / (d1 - d0);
    const fh = Math.round(dMax * Math.sin(Math.pow(u, 0.7) * Math.PI));
    if (fh < 1) continue;
    const bi = Math.round(t2 * bodyEnd);
    const bY = Math.round(cyAt(t2) - profile(t2) * hh);
    for (let k = 0; k < fh; k++) {
      const yy = bY - k;
      if (yy < 0) continue;
      drawPixel(cx, sx(bi), yy, k === fh - 1 ? P.out : (bi % 2 === 0 ? P.md : P.dk), ps);
    }
  }

  // === PASS 4: anal + pelvic fins ===
  if (big) {
    const a0 = 0.58, a1 = 0.76;
    const aMax = Math.max(2, Math.round(H * 0.15));
    for (let t3 = a0; t3 < a1; t3 += 1 / bodyEnd) {
      const u3 = (t3 - a0) / (a1 - a0);
      const ah = Math.round(aMax * Math.sin(Math.pow(u3, 0.7) * Math.PI));
      const ai = Math.round(t3 * bodyEnd);
      const aY = Math.round(cyAt(t3) + profile(t3) * hh);
      for (let k3 = 0; k3 < ah; k3++) {
        const ay = aY + k3;
        if (ay >= H) continue;
        drawPixel(cx, sx(ai), ay, k3 === ah - 1 ? P.out : (ai % 2 === 0 ? P.md : P.dk), ps);
      }
    }
    const v0 = 0.36, v1 = 0.46;
    const vMax = Math.max(1, Math.round(H * 0.10));
    for (let t4 = v0; t4 < v1; t4 += 1 / bodyEnd) {
      const vh = Math.round(vMax * Math.sin(((t4 - v0) / (v1 - v0)) * Math.PI));
      const vi = Math.round(t4 * bodyEnd);
      const vY = Math.round(cyAt(t4) + profile(t4) * hh);
      for (let k4 = 0; k4 < vh; k4++) {
        const vy = vY + k4;
        if (vy >= H) continue;
        drawPixel(cx, sx(vi), vy, P.dk, ps);
      }
    }
  }

  // === PASS 5: pectoral fin, hinged at the gill cover ===
  if (mid) {
    const pt = 0.29;
    const pLen = Math.max(3, Math.round(W * 0.15));
    const pBaseI = Math.round(pt * bodyEnd);
    const pBaseY = Math.round(cyAt(pt) + profile(pt) * hh * 0.40);
    for (let pk = 0; pk < pLen; pk++) {
      const pu = pk / pLen;
      const pI = pBaseI + pk;
      const pY = Math.round(pBaseY + pk * 0.66);
      const thick = Math.max(1, Math.round((1 - pu) * 3));
      for (let q = 0; q < thick; q++) {
        const yv = pY - q;
        if (yv < 0 || yv >= H) continue;
        drawPixel(cx, sx(pI), yv, (q === thick - 1 && pk > 0) ? P.lt : (pk % 2 === 0 ? P.md : P.dk), ps);
      }
      if (pY + 1 < H) drawPixel(cx, sx(pI), pY + 1, P.out, ps);
    }
  }

  // === PASS 6: caudal fin — forked, notched, ray-striated ===
  const tailLen = W - bodyEnd;
  const tcy = cyAt(1.0);
  const pedHalf = Math.max(1, Math.floor(profile(1.0) * hh));
  const maxSpread = Math.max(2, Math.round(hh * (shape === 'sleek' ? 1.0 : 0.92)));
  const minLen = Math.max(1, tailLen * 0.40);
  for (let ti = 0; ti < tailLen; ti++) {
    const tu = (ti + 1) / tailLen;
    const spread = Math.round(pedHalf + (maxSpread - pedHalf) * Math.pow(tu, 0.68));
    const TX = sx(bodyEnd + ti);
    for (let td = -spread; td <= spread; td++) {
      const v = Math.abs(td) / Math.max(1, maxSpread);
      const L = minLen + (tailLen - minLen) * Math.pow(v, 0.78);
      if (ti + 1 > L) continue;
      const ty = Math.round(tcy + td);
      if (ty < 0 || ty >= H) continue;
      const ray = Math.round(Math.abs(td) * 0.75);
      const edge = Math.abs(td) === spread || ti + 1 > L - 1;
      drawPixel(cx, TX, ty, edge ? P.out : (ray % 2 === 0 ? P.md : P.dk), ps);
    }
  }

  // === PASS 7: eye ===
  const et = 0.155;
  const eI = Math.round(et * bodyEnd);
  const eY = Math.round(cyAt(et) - profile(et) * hh * 0.28);
  drawFishEye(cx, ps, W, H, sx, eI, eY, P.out, FISH_IRIS);

  // === PASS 8: jaw notch ===
  const jawY = Math.round(cyAt(0.04) + profile(0.04) * hh * 0.30);
  const open = (af < ENEMY_ANIM_FRAMES / 2 && big) ? 1 : 0;
  for (let mi = 0; mi < (big ? 3 : 2); mi++) {
    const my = jawY + (mi === 0 ? open : 0);
    if (my > 0 && my < H) drawPixel(cx, sx(1 + mi), my, P.out, ps);
  }

  cacheSprite(key, c);
  return { canvas: c, w: sizeDef.w * ps, h: sizeDef.h * ps };
}

// Shark sprite
// Shark. Heterocercal tail, full fin set, underslung jaw, five gill slits.
const SHARK_PAL = {
  hi: '#B9CBD6', lt: '#7D93A6', md: '#59708A', dk: '#3A4E68', out: '#151E2E',
  belly: '#EDF2F5', bshad: '#C2CFD9', tooth: '#FFFFFF', gum: '#7E2430', iris: '#C8D6DF',
};

function createShark(frame, facingLeft, attacking) {
  const sw = 120;
  const sh = 48;
  const ps = 2;
  const af = frame % SHARK_ANIM_FRAMES;
  const atk = !!attacking;
  const key = `shark_${af}_${facingLeft}_${atk}`;
  const cached = spriteCache.get(key);
  if (cached) return { canvas: cached, w: sw * ps, h: sh * ps };

  const c = document.createElement('canvas');
  c.width = sw * ps;
  c.height = sh * ps;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;

  const W = sw, H = sh, hh = Math.floor(H / 2);
  const S = SHARK_PAL;
  const bodyEnd = Math.floor(W * 0.72); // the rest is caudal fin

  // Sharks undulate the rear half and hold the head nearly still
  const phase = af * (TAU / SHARK_ANIM_FRAMES);
  const bend = (t) => Math.sin(phase - t * 2.2) * 3.0 * Math.pow(Math.max(0, (t - 0.18) / 0.82), 1.7);
  const sx = (i) => (facingLeft ? i : W - 1 - i);
  const cyAt = (t) => hh + bend(t);

  // Conical snout, widest at the pectoral girdle, long taper to a keeled peduncle
  function prof(t) {
    if (t < 0.11) return Math.pow(t / 0.11, 0.52) * 0.58;
    if (t < 0.32) return 0.58 + ((t - 0.11) / 0.21) * 0.42;
    return 1.0 - Math.pow((t - 0.32) / 0.68, 0.85) * 0.88;
  }
  // Flat-ish back, deeper belly; the snout overhangs the mouth
  const topH = (t) => prof(t) * 12.5 * (t < 0.16 ? 0.78 : 1.0);
  const botH = (t) => prof(t) * 14.0 * (t < 0.16 ? 0.85 : 1.0);
  // Real sharks have a ragged countershading boundary, not a straight cut
  const shadeLine = (t) => 0.52 + Math.sin(t * 17.0 + 0.6) * 0.11 + Math.sin(t * 41.0) * 0.05;

  // === PASS 1: body ===
  for (let i = 0; i < bodyEnd; i++) {
    const t = i / bodyEnd;
    const th = Math.floor(topH(t));
    const bh = Math.floor(botH(t));
    if (th < 1 && bh < 1) continue;
    const cy = cyAt(t);
    const X = sx(i);
    const sl = shadeLine(t);
    const specDy = -Math.round(th * 0.52);
    for (let dy = -th; dy <= bh; dy++) {
      const y = Math.round(cy + dy);
      if (y < 0 || y >= H) continue;
      const ny = dy < 0 ? dy / Math.max(1, th) : dy / Math.max(1, bh);
      let col;
      if (dy === -th || dy === bh || t < 0.02) col = S.out;
      else if (ny < -0.62) col = S.dk;
      else if (ny < -0.06) col = S.md;
      else if (ny < sl) col = S.lt;
      else if (ny < 0.86) col = S.belly;
      else col = S.bshad;
      if (col !== S.out && th > 3 && dy === specDy && i % 2 === 0 && t > 0.14 && t < 0.52) col = S.hi;
      drawPixel(cx, X, y, col, ps);
    }
  }

  // === PASS 2: ampullae of Lorenzini across the snout ===
  for (let ai = 0; ai < 16; ai++) {
    const at = 0.015 + spriteHash(ai, 3, 7) * 0.11;
    const an = (spriteHash(ai, 9, 4) - 0.5) * 1.3;
    const ay = Math.round(cyAt(at) + an * topH(at));
    if (ay > 0 && ay < H) drawPixel(cx, sx(Math.round(at * bodyEnd)), ay, S.dk, ps);
  }

  // === PASS 3: five slanted gill slits, shortening toward the rear ===
  for (let g = 0; g < 5; g++) {
    const gt = 0.255 + g * 0.030;
    const gcy = cyAt(gt);
    const gTop = -topH(gt) * 0.44;
    const gBot = botH(gt) * (0.20 - g * 0.02);
    for (let gd = gTop; gd <= gBot; gd += 1) {
      const gn = gd / Math.max(1, topH(gt));
      const gy = Math.round(gcy + gd);
      if (gy > 0 && gy < H) {
        drawPixel(cx, sx(Math.round(gt * bodyEnd + gn * 2.4 + gn * gn * 1.4)), gy, S.dk, ps);
      }
    }
  }

  // === PASS 4: first dorsal (falcate, concave trailing edge) + second dorsal ===
  const d0 = 0.33, d1 = 0.51, dMax = 10;
  for (let t2 = d0; t2 < d1; t2 += 1 / bodyEnd) {
    const u = (t2 - d0) / (d1 - d0);
    const fh = Math.round(dMax * (u < 0.28
      ? Math.pow(u / 0.28, 0.65)
      : Math.pow(1 - (u - 0.28) / 0.72, 1.55)));
    if (fh < 1) continue;
    const bi = Math.round(t2 * bodyEnd);
    const bY = Math.round(cyAt(t2) - topH(t2));
    for (let k = 0; k < fh; k++) {
      const yy = bY - k;
      if (yy < 0) continue;
      const edge = k === fh - 1 || k === 0;
      drawPixel(cx, sx(bi), yy, edge ? S.out : (k > fh - 4 ? S.dk : (bi % 2 === 0 ? S.md : S.dk)), ps);
    }
  }
  for (let t3 = 0.60; t3 < 0.67; t3 += 1 / bodyEnd) {
    const fh2 = Math.round(5 * Math.sin(Math.pow((t3 - 0.60) / 0.07, 0.6) * Math.PI));
    const bi2 = Math.round(t3 * bodyEnd);
    const bY2 = Math.round(cyAt(t3) - topH(t3));
    for (let k2 = 0; k2 < fh2; k2++) {
      const y2 = bY2 - k2;
      if (y2 < 0) continue;
      drawPixel(cx, sx(bi2), y2, k2 === fh2 - 1 ? S.out : S.dk, ps);
    }
  }

  // === PASS 5: pectoral fin (long, swept back and down) + pelvic + anal ===
  const pBaseI = Math.round(0.30 * bodyEnd);
  const pBaseY = Math.round(cyAt(0.30) + botH(0.30) * 0.72);
  for (let pk = 0; pk < 15; pk++) {
    const pu = pk / 15;
    const pI = pBaseI + Math.round(pk * 0.90);
    const pY = Math.round(pBaseY + pk * 0.55);
    const thick = Math.max(1, Math.round((1 - Math.pow(pu, 0.7)) * 6));
    for (let q = 0; q < thick; q++) {
      const yv = pY - q;
      if (yv < 0 || yv >= H) continue;
      drawPixel(cx, sx(pI), yv, (q === thick - 1 && pk > 1) ? S.lt : (pk % 2 === 0 ? S.md : S.dk), ps);
    }
    if (pY + 1 < H) drawPixel(cx, sx(pI), pY + 1, S.out, ps);
  }
  function smallFin(t0, len, drop) {
    const bI = Math.round(t0 * bodyEnd);
    const bY = Math.round(cyAt(t0) + botH(t0));
    for (let k = 0; k < len; k++) {
      const yv = bY + Math.round(k * drop);
      const th2 = Math.max(1, Math.round((1 - k / len) * 3));
      for (let q2 = 0; q2 < th2; q2++) {
        const y3 = yv + q2;
        if (y3 >= H) continue;
        drawPixel(cx, sx(bI + k), y3, q2 === th2 - 1 ? S.out : S.dk, ps);
      }
    }
  }
  smallFin(0.50, 7, 0.55); // pelvic
  smallFin(0.63, 6, 0.50); // anal

  // === PASS 6: heterocercal caudal fin — long notched upper lobe, short lower lobe ===
  const tStart = bodyEnd;
  const tcy = cyAt(1.0);
  const upLen = W - tStart;
  const loLen = Math.round(upLen * 0.52);
  for (let ui = 0; ui < upLen; ui++) {
    const uu = ui / upLen;
    let lead = -ui * 0.62;
    let trail = -ui * 0.24;
    if (uu > 0.72) trail = -ui * 0.24 - ((uu - 0.72) / 0.28) * ui * 0.28; // terminal notch
    if (uu > 0.94) lead = -ui * 0.62 + ((uu - 0.94) / 0.06) * ui * 0.14;
    const TX = sx(tStart + ui);
    for (let dyu = Math.round(lead); dyu <= Math.round(trail); dyu++) {
      const yu = Math.round(tcy + dyu);
      if (yu < 0 || yu >= H) continue;
      const edge = dyu === Math.round(lead) || dyu === Math.round(trail);
      drawPixel(cx, TX, yu, edge ? S.out : (Math.round(Math.abs(dyu) * 0.8) % 2 === 0 ? S.md : S.dk), ps);
    }
  }
  for (let li = 0; li < loLen; li++) {
    const lu = li / loLen;
    let lLead = li * 0.62;
    const lTrail = li * 0.18;
    if (lu > 0.80) lLead = li * 0.62 - ((lu - 0.80) / 0.20) * li * 0.20;
    const LX = sx(tStart + li);
    for (let dyl = Math.round(lTrail); dyl <= Math.round(lLead); dyl++) {
      const yl = Math.round(tcy + dyl);
      if (yl < 0 || yl >= H) continue;
      const edge2 = dyl === Math.round(lLead) || dyl === Math.round(lTrail);
      drawPixel(cx, LX, yl, edge2 ? S.out : (Math.round(Math.abs(dyl) * 0.8) % 2 === 0 ? S.md : S.dk), ps);
    }
  }
  for (let fi = 0; fi < Math.round(upLen * 0.3); fi++) { // fill the fork near the stalk
    const FX = sx(tStart + fi);
    for (let fd = Math.round(-fi * 0.24); fd <= Math.round(fi * 0.18); fd++) {
      const fy = Math.round(tcy + fd);
      if (fy < 0 || fy >= H) continue;
      drawPixel(cx, FX, fy, S.md, ps);
    }
  }

  // === PASS 7: underslung jaw — the snout overhangs, teeth hang from the jaw line ===
  const gape = atk ? 2 : (af % SHARK_ANIM_FRAMES < 6 ? 1 : 0);
  const jawPts = [];
  for (let jt = 0.025; jt < 0.215; jt += 0.008) {
    const jy = Math.round(cyAt(jt) + botH(jt) * (0.30 + Math.pow((jt - 0.025) / 0.19, 0.8) * 0.42));
    const jx = Math.round(jt * bodyEnd);
    jawPts.push([jx, jy]);
    if (jy > 0 && jy < H) drawPixel(cx, sx(jx), jy, S.out, ps);
    if (jy + 1 < H) drawPixel(cx, sx(jx), jy + 1, S.gum, ps);
  }
  for (let ji = 0; ji < jawPts.length; ji += 3) {
    const jp = jawPts[ji];
    if (jp[1] - 1 > 0) drawPixel(cx, sx(jp[0]), jp[1] - 1, S.tooth, ps);
    if (gape > 0 && jp[1] + 1 + gape < H) {
      if (jp[1] + gape < H) drawPixel(cx, sx(jp[0]), jp[1] + gape, '#2A0C10', ps);
      drawPixel(cx, sx(jp[0]), jp[1] + 1 + gape, S.tooth, ps);
    }
  }

  // === PASS 8: eye — small and black; red only while a bite is arming ===
  const et = 0.135;
  const eI = Math.round(et * bodyEnd);
  const eY = Math.round(cyAt(et) - topH(et) * 0.42);
  for (let ox = -1; ox <= 1; ox++) {
    for (let oy = -1; oy <= 1; oy++) {
      const yy3 = eY + oy;
      if (yy3 < 0 || yy3 >= H) continue;
      const centre = ox === 0 && oy === 0;
      drawPixel(cx, sx(eI + ox), yy3, centre ? (atk ? '#E01818' : '#08070C') : S.dk, ps);
    }
  }
  if (atk) {
    drawPixel(cx, sx(eI), eY - 1, '#8E0C0C', ps);
    drawPixel(cx, sx(eI), eY + 1, '#8E0C0C', ps);
  } else {
    drawPixel(cx, sx(eI + (facingLeft ? -1 : 1)), eY - 1, '#FFFFFF', ps);
  }

  // === PASS 9: caudal keel ===
  for (let ki = Math.round(bodyEnd * 0.90); ki < bodyEnd; ki++) {
    drawPixel(cx, sx(ki), Math.round(cyAt(ki / bodyEnd)), S.hi, ps);
  }

  cacheSprite(key, c);
  return { canvas: c, w: sw * ps, h: sh * ps };
}

// Electric eel. Continuous per-column silhouette, moray dorsal ribbon, mottled flank.
// Charge reads as a pulse travelling head-to-tail rather than a whole-body strobe.
const EEL_PAL = {
  hi: '#C9D96B', lt: '#8AAE41', md: '#587D2C', dk: '#35521F', out: '#152410',
  belly: '#DFDCA4', elec: '#FBFF9C', arc: '#FFFFFF',
};
const EEL_SPRITE_W = 34; // logical pixels; * ps = the blit size
const EEL_SPRITE_H = 16;

function createEel(frame, facingLeft, charged) {
  const ps = 2;
  const af = frame % EEL_ANIM_FRAMES;
  const chg = !!charged;
  const key = `eel_${af}_${facingLeft}_${chg}`;
  const cached = spriteCache.get(key);
  if (cached) return { canvas: cached, w: EEL_SPRITE_W * ps, h: EEL_SPRITE_H * ps };

  const W = EEL_SPRITE_W, H = EEL_SPRITE_H;
  const c = document.createElement('canvas');
  c.width = W * ps;
  c.height = H * ps;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;

  const E = EEL_PAL;
  const hh = H / 2;
  const phase = af * (TAU / EEL_ANIM_FRAMES);
  const pulse = af / EEL_ANIM_FRAMES; // charge position, head (0) to tail (1)
  const sx = (i) => (facingLeft ? i : W - 1 - i);
  const cy = (u) => hh + Math.sin(phase - u * TAU * 1.35) * 3.1 * (0.30 + 0.70 * u);
  function half(u) {
    if (u < 0.07) return 1.1 + (u / 0.07) * 1.7;              // wedge head
    if (u < 0.26) return 2.8 + ((u - 0.07) / 0.19) * 0.6;     // thickest behind the head
    return Math.max(0.5, 3.4 - Math.pow((u - 0.26) / 0.74, 0.85) * 3.0);
  }

  for (let i = 0; i < W; i++) {
    const u = i / (W - 1);
    const hI = Math.round(half(u));
    const ccy = cy(u);
    const X = sx(i);

    // Dorsal ribbon runs the whole length; anal ribbon on the rear half
    const ribTop = Math.round(ccy - hI - 1);
    if (u > 0.10 && ribTop >= 0 && ribTop < H) drawPixel(cx, X, ribTop, i % 2 === 0 ? E.lt : E.md, ps);
    if (u > 0.52) {
      const ribBot = Math.round(ccy + hI + 1);
      if (ribBot < H) drawPixel(cx, X, ribBot, i % 2 === 0 ? E.md : E.dk, ps);
    }

    for (let dy = -hI; dy <= hI; dy++) {
      const y = Math.round(ccy + dy);
      if (y < 0 || y >= H) continue;
      const ny = dy / Math.max(1, hI);
      let col;
      if (dy === -hI || dy === hI) col = E.out;
      else if (ny < -0.42) col = E.dk;
      else if (ny < 0.14) col = E.md;
      else if (ny < 0.62) col = E.lt;
      else col = E.belly;
      if (col !== E.out && spriteHash(Math.floor(i / 2), Math.floor((dy + hI) / 2), 11) > 0.68) {
        col = ny < 0.2 ? E.dk : E.md;
      }
      if (chg) {
        const d = Math.abs(u - pulse);
        if (d < 0.16) col = d < 0.07 ? E.elec : E.hi;
      }
      drawPixel(cx, X, y, col, ps);
    }
  }

  // Head: gape line and eye
  const hcy = cy(0.055);
  const hI2 = Math.round(half(0.055));
  for (let m = 0; m < 4; m++) {
    const my = Math.round(hcy + hI2 * 0.35);
    if (my > 0 && my < H) drawPixel(cx, sx(1 + m), my, E.out, ps);
  }
  const eY = Math.round(cy(0.05) - 1);
  if (eY > 0 && eY < H) {
    drawPixel(cx, sx(2), eY, '#0A0A08', ps);
    drawPixel(cx, sx(3), eY, E.hi, ps);
  }

  // Discharge arcs, deterministic per frame so the sprite stays cacheable
  if (chg) {
    for (let s2 = 0; s2 < 5; s2++) {
      const au = spriteHash(s2, af, 21);
      const ay = Math.round(cy(au) + (spriteHash(s2, af, 33) - 0.5) * 10);
      if (ay > 0 && ay < H) drawPixel(cx, sx(Math.round(au * (W - 1))), ay, E.arc, ps);
    }
  }

  cacheSprite(key, c);
  return { canvas: c, w: W * ps, h: H * ps };
}

// Starfish power-up. Tapered arms with rounded tips, a raised central disc,
// ossicle bumps along each arm ridge, and a madreporite. Arms flex; they don't spin.
const STAR_PAL = { hi: '#FFCE96', lt: '#F09A50', md: '#DA652C', dk: '#A63A18', out: '#571407', deep: '#7C2410' };
const STAR_SPRITE_SIZE = 26;

function createStarfish(frame) {
  const ps = 2;
  const af = frame % STAR_ANIM_FRAMES;
  const key = `starfish_${af}`;
  const cached = spriteCache.get(key);
  if (cached) return { canvas: cached, w: STAR_SPRITE_SIZE * ps, h: STAR_SPRITE_SIZE * ps };

  const N = STAR_SPRITE_SIZE;
  const c = document.createElement('canvas');
  c.width = N * ps;
  c.height = N * ps;
  const cx = c.getContext('2d');
  cx.imageSmoothingEnabled = false;

  const S = STAR_PAL;
  const phase = af * (TAU / STAR_ANIM_FRAMES);
  const cxp = (N - 1) / 2, cyp = (N - 1) / 2;
  const R = 11.4;

  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const dx = x - cxp, dy = y - cyp;
      const r = Math.sqrt(dx * dx + dy * dy);
      if (r > R + 1.4) continue;
      const a = Math.atan2(dy, dx);

      // Nearest of the five arms
      let best = 1e9, armI = 0;
      for (let k = 0; k < 5; k++) {
        const aa = -Math.PI / 2 + k * (TAU / 5);
        const d = Math.atan2(Math.sin(a - aa), Math.cos(a - aa));
        if (Math.abs(d) < Math.abs(best)) { best = d; armI = k; }
      }

      const u = Math.min(1, r / R);
      const curl = Math.sin(phase + armI * 1.25) * 0.13; // slow flex, arms out of phase
      const arc = Math.abs(best - curl * u) * r;
      let hw = Math.pow(1 - u, 0.60) * 4.7 + 0.9;
      if (u > 0.88) hw *= Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.88) / 0.12, 2))) * 0.9 + 0.1; // rounded tip
      const inArm = r <= R && arc <= hw;
      const inDisc = r <= 4.3;
      if (!inArm && !inDisc) continue;

      const d2 = inDisc ? Math.min(1, r / 4.3) * 0.55 : arc / Math.max(0.6, hw);
      let col;
      if (d2 > 0.88 || r > R - 0.6) col = S.out;
      else if (d2 > 0.66) col = S.dk;
      else if (d2 > 0.34) col = S.md;
      else col = S.lt;
      if (!inDisc && u > 0.84) col = d2 > 0.55 ? S.out : S.dk;
      if (!inDisc && d2 < 0.42 && spriteHash(x, y, 5) > 0.60) col = S.hi; // ossicles
      if (inDisc && d2 < 0.30) col = S.md;
      drawPixel(cx, x, y, col, ps);
    }
  }

  // Madreporite
  drawPixel(cx, Math.round(cxp + 2), Math.round(cyp - 2), S.deep, ps);
  drawPixel(cx, Math.round(cxp + 3), Math.round(cyp - 2), S.deep, ps);
  drawPixel(cx, Math.round(cxp + 2), Math.round(cyp - 1), S.deep, ps);

  cacheSprite(key, c);
  return { canvas: c, w: N * ps, h: N * ps };
}

// ============================================================
//  PARTICLE SYSTEM
// ============================================================
const particles = [];

function spawnBubble(x, y) {
  particles.push({
    type: 'bubble',
    x, y,
    vx: (Math.random() - 0.5) * 0.5,
    vy: -1 - Math.random() * 1.5,
    size: 2 + Math.random() * 4,
    life: 60 + Math.random() * 60,
    maxLife: 120,
    alpha: 0.6,
  });
}

function spawnEatParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 / 12) * i;
    particles.push({
      type: 'sparkle',
      x, y,
      vx: Math.cos(angle) * (2 + Math.random() * 2),
      vy: Math.sin(angle) * (2 + Math.random() * 2),
      size: 3 + Math.random() * 3,
      life: 20 + Math.random() * 15,
      maxLife: 35,
      color: color,
      alpha: 1,
    });
  }
}

function spawnScorePopup(x, y, text) {
  particles.push({
    type: 'text',
    x, y,
    vx: 0,
    vy: -1.5,
    text: text,
    life: 50,
    maxLife: 50,
    alpha: 1,
  });
}

function spawnDeathParticles(x, y) {
  for (let i = 0; i < 25; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      type: 'sparkle',
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 2 + Math.random() * 5,
      life: 30 + Math.random() * 30,
      maxLife: 60,
      color: ['#FF4444', '#FFAA00', '#FFFFFF', '#FF8844'][Math.floor(Math.random() * 4)],
      alpha: 1,
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    p.alpha = Math.max(0, p.life / p.maxLife);
    if (p.type === 'bubble') {
      p.vx += (Math.random() - 0.5) * 0.1;
      p.x += Math.sin(p.life * 0.15) * 0.3;
    }
    if (p.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    ctx.globalAlpha = p.alpha;
    if (p.type === 'bubble') {
      ctx.strokeStyle = '#AADDFF';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(170,221,255,0.15)';
      ctx.fill();
      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.25, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.type === 'sparkle') {
      ctx.fillStyle = p.color;
      const sz = p.size * p.alpha;
      ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
    } else if (p.type === 'text') {
      ctx.fillStyle = '#FFFF00';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }
}

// ============================================================
//  BACKGROUND RENDERING
// ============================================================
let bgCanvas = null;
let bgLevel = -1; // track which level the background was built for

// Lerp between two hex colors; t=0 returns a, t=1 returns b
function lerpColor(a, b, t) {
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  const r = Math.round(pa[0] + (pb[0] - pa[0]) * t);
  const g = Math.round(pa[1] + (pb[1] - pa[1]) * t);
  const bl = Math.round(pa[2] + (pb[2] - pa[2]) * t);
  return '#' + ((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1);
}

function createBackground() {
  // Depth factor: 0 at level 1, ramps to 1 by level 6
  const depth = Math.min(1, (level - 1) / 5);

  bgCanvas = document.createElement('canvas');
  bgCanvas.width = GW;
  bgCanvas.height = GH;
  bgLevel = level;
  const bgx = bgCanvas.getContext('2d');

  // Ocean gradient — shifts from blue-green to deep navy with depth
  const grad = bgx.createLinearGradient(0, 0, 0, GH);
  grad.addColorStop(0,   lerpColor('#1a6aaf', '#0a1230', depth));
  grad.addColorStop(0.3, lerpColor('#0e4a7a', '#070e28', depth));
  grad.addColorStop(0.6, lerpColor('#0a3460', '#050a1e', depth));
  grad.addColorStop(1,   lerpColor('#061a30', '#020612', depth));
  bgx.fillStyle = grad;
  bgx.fillRect(0, 0, GW, GH);

  // Light rays from surface — fade as water deepens
  const rayAlpha = 0.06 * (1 - depth * 0.7);
  bgx.globalAlpha = rayAlpha;
  for (let i = 0; i < 8; i++) {
    const x = 60 + i * 80;
    bgx.fillStyle = lerpColor('#66bbff', '#223366', depth);
    bgx.beginPath();
    bgx.moveTo(x - 5, 0);
    bgx.lineTo(x + 5, 0);
    bgx.lineTo(x + 30 + Math.random() * 20, GH);
    bgx.lineTo(x - 30 - Math.random() * 20, GH);
    bgx.fill();
  }
  bgx.globalAlpha = 1;

  // Sandy bottom — darkens with depth
  const sandGrad = bgx.createLinearGradient(0, GH - 50, 0, GH);
  sandGrad.addColorStop(0, '#2a1a0a00');
  sandGrad.addColorStop(0.3, lerpColor('#3d2b1a', '#1a1210', depth));
  sandGrad.addColorStop(1,   lerpColor('#5a4030', '#2a1a12', depth));
  bgx.fillStyle = sandGrad;
  bgx.fillRect(0, GH - 50, GW, 50);

  // Sand texture
  for (let i = 0; i < 200; i++) {
    const sx = Math.random() * GW;
    const sy = GH - 40 + Math.random() * 35;
    bgx.fillStyle = Math.random() > 0.5
      ? lerpColor('#6a5040', '#302018', depth)
      : lerpColor('#4a3020', '#1a0e08', depth);
    bgx.fillRect(sx, sy, 2, 2);
  }

  // Seaweed — darkens with depth
  const seaweedColors = [
    [lerpColor('#1a8a2a', '#0a3a12', depth),
     lerpColor('#2a9a3a', '#0e4a18', depth),
     lerpColor('#0a7a1a', '#06300e', depth)],
  ];
  for (let s = 0; s < 12; s++) {
    const sx = 30 + s * 55 + Math.random() * 20;
    const sheight = 40 + Math.random() * 60;
    const baseY = GH - 35;
    bgx.strokeStyle = seaweedColors[0][s % 3];
    bgx.lineWidth = 3;
    bgx.beginPath();
    bgx.moveTo(sx, baseY);
    for (let j = 0; j < sheight; j += 4) {
      const wave = Math.sin(j * 0.1 + s) * 8;
      bgx.lineTo(sx + wave, baseY - j);
    }
    bgx.stroke();

    // Leaves
    for (let l = 0; l < 3; l++) {
      const ly = baseY - 15 - l * 15;
      const ldir = l % 2 === 0 ? 1 : -1;
      bgx.fillStyle = lerpColor('#2aaa3a', '#0e4a18', depth);
      bgx.beginPath();
      bgx.ellipse(sx + ldir * 6 + Math.sin(ly * 0.1) * 5, ly, 8, 3, ldir * 0.3, 0, Math.PI * 2);
      bgx.fill();
    }
  }

  // Coral pieces — muted as light fades
  const coralBase = ['#FF6B6B', '#FF9F43', '#FECA57', '#FF6B81', '#EE5A24'];
  const coralDark = ['#6B2020', '#6B4018', '#6B5520', '#6B2030', '#5A1A08'];
  const coralColors = coralBase.map((c, i) => lerpColor(c, coralDark[i], depth));
  for (let c = 0; c < 8; c++) {
    const cx2 = 50 + c * 80 + Math.random() * 30;
    const cy = GH - 38;
    bgx.fillStyle = coralColors[c % coralColors.length];
    // Branching coral
    for (let b = 0; b < 5; b++) {
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
      const len = 8 + Math.random() * 14;
      const bx = cx2 + Math.cos(angle) * len;
      const by = cy + Math.sin(angle) * len;
      bgx.beginPath();
      bgx.moveTo(cx2, cy);
      bgx.lineTo(bx, by);
      bgx.lineWidth = 3 + Math.random() * 2;
      bgx.strokeStyle = coralColors[c % coralColors.length];
      bgx.stroke();
      // Tip
      bgx.beginPath();
      bgx.arc(bx, by, 3, 0, Math.PI * 2);
      bgx.fill();
    }
  }

  // Small rocks
  for (let r = 0; r < 15; r++) {
    const rx = Math.random() * GW;
    const ry = GH - 30 + Math.random() * 15;
    bgx.fillStyle = lerpColor('#5a5040', '#201a14', depth);
    bgx.beginPath();
    bgx.ellipse(rx, ry, 4 + Math.random() * 6, 3 + Math.random() * 3, 0, 0, Math.PI * 2);
    bgx.fill();
  }

  // Shells
  for (let sh = 0; sh < 5; sh++) {
    const shx = 80 + sh * 130 + Math.random() * 40;
    const shy = GH - 30 + Math.random() * 8;
    bgx.fillStyle = lerpColor('#FFF0DB', '#5a4a38', depth);
    bgx.beginPath();
    bgx.arc(shx, shy, 4, Math.PI, 0);
    bgx.fill();
    bgx.strokeStyle = lerpColor('#DDB892', '#4a3828', depth);
    bgx.lineWidth = 1;
    bgx.stroke();
    // Shell ridges
    for (let i = 0; i < 3; i++) {
      bgx.beginPath();
      bgx.arc(shx, shy, 2 + i * 1, Math.PI + 0.3, -0.3);
      bgx.stroke();
    }
  }
}

// Scrolling water caustics
let causticOffset = 0;
function drawCaustics() {
  const depth = Math.min(1, (level - 1) / 5);
  ctx.globalAlpha = 0.04 * (1 - depth * 0.7);
  ctx.fillStyle = lerpColor('#66ccff', '#1a2a44', depth);
  causticOffset = (causticOffset + 0.3) % (TAU / 0.01);
  // All the quads share one colour, so batch them into a single path and fill once.
  ctx.beginPath();
  for (let y = 0; y < GH - 60; y += 40) {
    const rowOffset = Math.sin((y + causticOffset) * 0.05) * 15; // constant across the row
    for (let x = 0; x < GW; x += 40) {
      const wx = x + rowOffset;
      const wy = y + Math.cos((x + causticOffset) * 0.04) * 10;
      ctx.moveTo(wx, wy);
      ctx.lineTo(wx + 20, wy + 5);
      ctx.lineTo(wx + 15, wy + 20);
      ctx.lineTo(wx - 5, wy + 15);
      ctx.closePath();
    }
  }
  ctx.fill();
  ctx.globalAlpha = 1;
}

      playNote(400 + hsEntryPos * 100, 0.05, 'square', sfxGain, 0.15);
    } else if (e.key === 'ArrowRight' || e.key === ' ') {
      if (hsEntryPos < 2) {
        hsEntryPos++;
        playNote(500, 0.05, 'square', sfxGain, 0.15);

      if (hsEntryPos > 0) {
        hsEntryPos--;

      }
    } else if (e.key === 'Enter') {
      // Commit the entry

function spawnEnemy() {
  // Determine which types can spawn based on player size
  // Allow fish up to 2 sizes above the player; type 6 appears when player is size 6
  const maxType = Math.min(6, player.sizeLevel + 2);
  let type;
  // Weight toward smaller fish
  const roll = Math.random();
  if (roll < 0.35) type = 0;
  else if (roll < 0.55) type = Math.min(1, maxType);
  else if (roll < 0.70) type = Math.min(2, maxType);
  else if (roll < 0.82) type = Math.min(3, maxType);
  else if (roll < 0.91) type = Math.min(4, maxType);
  else if (roll < 0.97) type = Math.min(5, maxType);
  else type = Math.min(6, maxType);

  const def = ENEMY_TYPES[type];
  const fromLeft = Math.random() > 0.5;
  const x = fromLeft ? -def.w : GW + def.w;
  const y = 30 + Math.random() * (GH - 100);
  const speed = def.speed * (0.8 + Math.random() * 0.4) * (1 + level * 0.05);

  enemies.push({
    x, y,
    vx: fromLeft ? speed : -speed,
    vy: (Math.random() - 0.5) * 0.5,
    type,
    width: def.w,
    height: def.h,
    facingLeft: !fromLeft,
    frame: Math.floor(Math.random() * 100),
    wobble: Math.random() * Math.PI * 2,
    points: def.points,
    sizeLevel: def.sizeLevel,
    colorIdx: Math.floor(Math.random() * FISH_PALETTES.length),
    patternIdx: Math.floor(Math.random() * FISH_MORPH_COUNT),
    dartTimer: 0,
    frozenTimer: 0,
    isEel: false,
  });
}

// Electric Eel
const EEL_WIDTH = 60; // spawn/despawn margin; the sprite sizes itself
const EEL_SPEED = 1.0;
const EEL_SHOCK_RADIUS = 70;
const EEL_FREEZE_DURATION = 36 * 3; // 3 seconds at 36fps
let eels = [];
let playerFrozenTimer = 0;

function spawnEel() {
  const fromLeft = Math.random() > 0.5;
  eels.push({

    y: 50 + Math.random() * (GH - 150),

    vy: (Math.random() - 0.5) * 0.3,

    shockFlash: 0,
  });
}

function sfxShock() {
  playNote(150, 0.1, 'sawtooth', sfxGain, 0.3);
  setTimeout(() => playNote(800, 0.08, 'square', sfxGain, 0.2), 50);
  setTimeout(() => playNote(200, 0.12, 'sawtooth', sfxGain, 0.25), 100);
}

function updateEels() {
  // Spawn eel occasionally when player is size 3+
  if (player.sizeLevel >= 3 && eels.length < 2 && Math.random() < 0.002) {
    spawnEel();
  }

  for (let i = eels.length - 1; i >= 0; i--) {
    const eel = eels[i];
    eel.x += eel.vx;
    eel.y += eel.vy;
    eel.y += Math.sin(eel.wobble + eel.frame * 0.06) * 0.5;
    eel.frame++;
    if (eel.shockCooldown > 0) eel.shockCooldown--;
    if (eel.shockFlash > 0) eel.shockFlash--;

    // Slight y drift toward center
    if (eel.y < 40) eel.vy += 0.02;
    if (eel.y > GH - 80) eel.vy -= 0.02;

    // Remove if off screen
    if ((eel.vx > 0 && eel.x > GW + 120) || (eel.vx < 0 && eel.x < -120)) {
      eels.splice(i, 1);
      continue;
    }

    // Shock check — every few seconds, shock nearby fish and player
    if (eel.shockCooldown <= 0 && Math.random() < 0.008) {
      triggerEelShock(eel);
    }
  }
}

function triggerEelShock(eel) {
  eel.shockCooldown = 36 * 5; // 5 second cooldown between shocks
  eel.shockFlash = 20;
  sfxShock();
  flashTimer = 8;

  // Shock particles
  for (let a = 0; a < 8; a++) {
    const angle = (a / 8) * Math.PI * 2;
    particles.push({
      x: eel.x + Math.cos(angle) * 15,
      y: eel.y + Math.sin(angle) * 15,
      vx: Math.cos(angle) * 3,
      vy: Math.sin(angle) * 3,
      life: 20,
      maxLife: 20,
      color: '#FFFF44',
      size: 3,
    });
  }

  // Freeze nearby enemies
  enemies.forEach(e => {
    const dx = e.x - eel.x;
    const dy = e.y - eel.y;
    if (Math.sqrt(dx * dx + dy * dy) < EEL_SHOCK_RADIUS) {
      e.frozenTimer = EEL_FREEZE_DURATION;
    }
  });

  // Freeze player if in range
  const pdx = player.x - eel.x;
  const pdy = player.y - eel.y;
  if (Math.sqrt(pdx * pdx + pdy * pdy) < EEL_SHOCK_RADIUS) {
    playerFrozenTimer = EEL_FREEZE_DURATION;
  }

  // Freeze other eels in range
  eels.forEach(other => {
    if (other === eel) return;
    const dx = other.x - eel.x;
    const dy = other.y - eel.y;
    if (Math.sqrt(dx * dx + dy * dy) < EEL_SHOCK_RADIUS) {
      other.shockCooldown = EEL_FREEZE_DURATION;
    }
  });
}

function drawEels() {
  eels.forEach(eel => {
    const ex = eel.x;
    const ey = eel.y;

    // Shock radius indicator when about to shock
    if (eel.shockFlash > 0) {
      ctx.save();
      ctx.globalAlpha = eel.shockFlash / 20 * 0.4;
      ctx.strokeStyle = '#FFFF44';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ex, ey, EEL_SHOCK_RADIUS, 0, Math.PI * 2);
      ctx.stroke();
      // Lightning bolts
      for (let b = 0; b < 6; b++) {
        const angle = (b / 6) * Math.PI * 2 + frameCount * 0.3;
        const r = EEL_SHOCK_RADIUS * 0.7;
        ctx.strokeStyle = '#FFFF88';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(ex, ey);
        const midR = r * 0.5;
        ctx.lineTo(
          ex + Math.cos(angle) * midR + (Math.random() - 0.5) * 15,
          ey + Math.sin(angle) * midR + (Math.random() - 0.5) * 15
        );
        ctx.lineTo(
          ex + Math.cos(angle) * r,
          ey + Math.sin(angle) * r
        );
        ctx.stroke();
      }
      ctx.restore();
    }

    // Body — a cached pixel sprite, blitted like every other entity.
    // The undulation runs one cycle per 6 update ticks * EEL_ANIM_FRAMES.
    const af = Math.floor(eel.frame / 6);
    const spriteData = createEel(af, eel.facingLeft, eel.shockFlash > 0);
    ctx.drawImage(spriteData.canvas,
      ex - spriteData.w / 2,
      ey - spriteData.h / 2,
      spriteData.w,
      spriteData.h
    );
  });
}

function drawFrozenEffect(x, y, w, h) {
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#88DDFF';
  ctx.fillRect(x - w / 2 - 2, y - h / 2 - 2, w + 4, h + 4);
  ctx.globalAlpha = 0.6;
  ctx.strokeStyle = '#AAEEFF';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - w / 2 - 2, y - h / 2 - 2, w + 4, h + 4);
  // Ice crystals
  ctx.fillStyle = '#FFFFFF';
  ctx.globalAlpha = 0.7;
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('*', x - w * 0.3, y - h * 0.2);
  ctx.fillText('*', x + w * 0.2, y + h * 0.15);
  ctx.restore();
}
