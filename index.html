}

function createBonusBackground() {
  bonusBgCanvas = document.createElement('canvas');
  bonusBgCanvas.width = GW;
  bonusBgCanvas.height = GH;
  const bx = bonusBgCanvas.getContext('2d');
  // Bright blue-green ocean
  const grad = bx.createLinearGradient(0, 0, 0, GH);
  grad.addColorStop(0, '#1a8acf');
  grad.addColorStop(0.3, '#1570aa');
  grad.addColorStop(0.6, '#0e5a8a');
  grad.addColorStop(1, '#083a60');
  bx.fillStyle = grad;
  bx.fillRect(0, 0, GW, GH);
  // Light rays
  bx.globalAlpha = 0.08;
  for (let i = 0; i < 8; i++) {
    const rx = 50 + Math.random() * (GW - 100);
    bx.fillStyle = '#FFFFFF';
    bx.beginPath();
    bx.moveTo(rx - 10, 0);
    bx.lineTo(rx + 10, 0);
    bx.lineTo(rx + 40 + Math.random() * 30, GH);
    bx.lineTo(rx - 40 - Math.random() * 30, GH);
    bx.fill();
  }
  bx.globalAlpha = 1;
  // Sandy bottom
  bx.fillStyle = '#c8a860';
  bx.fillRect(0, GH - 40, GW, 40);
  bx.fillStyle = '#d4b870';
  bx.fillRect(0, GH - 40, GW, 3);
}

function updateBonusRound() {
  bonusTimer--;

  // Player movement (reuse normal controls but simplified)
  const accel = 0.45;
  const maxSpeed = 3.5 + player.sizeLevel * 0.2;
  const friction = 0.92;

  if (keys['arrowleft'] || keys['a']) { player.vx -= accel; player.facingLeft = true; }
  if (keys['arrowright'] || keys['d']) { player.vx += accel; player.facingLeft = false; }
  if (keys['arrowup'] || keys['w']) player.vy -= accel;
  if (keys['arrowdown'] || keys['s']) player.vy += accel;

  player.vx *= friction;
  player.vy *= friction;
  const speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  if (speed > maxSpeed) {
    player.vx = (player.vx / speed) * maxSpeed;
    player.vy = (player.vy / speed) * maxSpeed;
  }
  player.x += player.vx;
  player.y += player.vy;

  const hw = player.width / 2;
  const hh = player.height / 2;
  if (player.x < hw) { player.x = hw; player.vx *= -0.5; }
  if (player.x > GW - hw) { player.x = GW - hw; player.vx *= -0.5; }
  if (player.y < hh + 10) { player.y = hh + 10; player.vy *= -0.5; }
  if (player.y > GH - 55 - hh) { player.y = GH - 55 - hh; player.vy *= -0.5; }

  // Check pellet collection
  let allCollected = true;
  for (let i = 0; i < bonusPellets.length; i++) {
    const p = bonusPellets[i];
    if (!p.active) continue;
    allCollected = false;
    const dx = player.x - p.x;
    const dy = player.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < (player.width * 0.4 + p.size)) {
      p.active = false;
      const pts = p.points;
      bonusScore += pts;
      score += pts;
      sfxEat();
      spawnEatParticles(p.x, p.y, p.color);
      spawnScorePopup(p.x, p.y - 10, `+${pts}`);
    }
  }

  // Bubble trail
  if (frameCount % 12 === 0 && (Math.abs(player.vx) > 0.5 || Math.abs(player.vy) > 0.5)) {
    const bx = player.facingLeft ? player.x + hw : player.x - hw;
    spawnBubble(bx, player.y);
  }

  // End bonus round
  if (bonusTimer <= 0 || allCollected) {
    endBonusRound();
  }
}

function endBonusRound() {
  gameState = STATE.PLAYING;
  // Reset background to level 1 style
  level = bonusLevelBefore;
  bgLevel = -1; // force background regeneration
  const savedLevel = level;
  level = 1;
  createBackground();
  level = savedLevel;
  bgLevel = level; // prevent re-creation with dark style
  // Resume music
  if (!musicPlaying || currentMusic !== 'happy') {
    startMusic('happy');
  }
  // Re-initialize shark timer and enemies
  sharkTimer = 300 + Math.random() * 200;
}

function drawBonusRound() {
  // Bright background
  if (bonusBgCanvas) {
    ctx.drawImage(bonusBgCanvas, 0, 0);
  }
  drawCaustics();
  drawAmbientBubbles();

  // Draw pellets
  bonusPellets.forEach(p => {
    if (!p.active) return;
    const bob = Math.sin(p.bobOffset + frameCount * 0.08) * 3;
    const pulse = 1 + Math.sin(frameCount * 0.15 + p.bobOffset) * 0.15;

    // Glow
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + bob, p.size * pulse * 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Pellet
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y + bob, p.size * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Highlight
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(p.x - p.size * 0.25, p.y + bob - p.size * 0.25, p.size * 0.35, 0, Math.PI * 2);
    ctx.fill();
  });

  // Draw player
  const sprite = createPlayerFish(player.sizeLevel, frameCount, player.facingLeft);
  ctx.drawImage(sprite,
    player.x - player.width / 2,
    player.y - player.height / 2,
    player.width,
    player.height
  );

  // Particles
  updateParticles();
  drawParticles();

  // HUD
  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 24px monospace';
  ctx.fillText('BONUS ROUND!', GW / 2, 30);

  // Timer
  const secs = Math.ceil(bonusTimer / 36);
  const timerBlink = secs <= 5 ? (frameCount % 10 < 5) : true;
  ctx.fillStyle = secs <= 5 ? '#FF4444' : '#FFFFFF';
  ctx.font = 'bold 18px monospace';
  if (timerBlink) {
    ctx.fillText(`TIME: ${secs}`, GW / 2, 55);
  }

  // Bonus score
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 14px monospace';
  ctx.fillText(`BONUS: ${bonusScore}`, GW / 2, 75);

  // Pellets remaining
  const remaining = bonusPellets.filter(p => p.active).length;
  ctx.fillStyle = '#AADDFF';
  ctx.font = '12px monospace';
  ctx.fillText(`PELLETS: ${remaining}`, GW / 2, 92);

  // Main score
  ctx.textAlign = 'left';
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 18px monospace';
  ctx.fillText(`SCORE: ${score}`, 12, 24);

  // Music indicator
  ctx.textAlign = 'right';
  ctx.fillStyle = musicEnabled ? 'rgba(136,255,170,0.6)' : 'rgba(170,136,136,0.6)';
  ctx.font = '9px monospace';
  ctx.fillText(`${musicEnabled ? '\u266A' : 'X'} MUSIC [M]`, GW - 8, GH - 8);
}

function updatePlayer() {
  if (playerFrozenTimer > 0) {
    playerFrozenTimer--;
    player.vx *= 0.85;
    player.vy *= 0.85;
    player.x += player.vx;
    player.y += player.vy;
    if (player.invincible > 0) player.invincible--;
    return;
  }

  const accel = 0.45;
  const maxSpeed = 3.5 + player.sizeLevel * 0.2;
  const friction = 0.92;

  if (keys['arrowleft'] || keys['a']) {
    player.vx -= accel;
    player.facingLeft = true;
  }
  if (keys['arrowright'] || keys['d']) {
    player.vx += accel;
    player.facingLeft = false;
  }
  if (keys['arrowup'] || keys['w']) player.vy -= accel;
  if (keys['arrowdown'] || keys['s']) player.vy += accel;

  // Dart (spacebar)
  if (player.dartCooldown > 0) player.dartCooldown--;
  if (player.dartTimer > 0) player.dartTimer--;

  if ((keys[' '] || keys['Space']) && player.dartCooldown <= 0) {
    // Determine dart direction from movement or facing
    let dx = player.vx;
    let dy = player.vy;
    const mag = Math.sqrt(dx * dx + dy * dy);
    if (mag > 0.3) {
      dx /= mag; dy /= mag;
    } else {
      dx = player.facingLeft ? -1 : 1;
      dy = 0;
    }
    player.vx += dx * DART_BOOST;
    player.vy += dy * DART_BOOST;
    player.dartTimer = DART_DURATION;
    player.dartCooldown = DART_COOLDOWN;
    sfxDart();
    // Burst of bubbles behind the fish
    const bx = player.facingLeft ? player.x + player.width / 2 : player.x - player.width / 2;
    for (let b = 0; b < 4; b++) {
      spawnBubble(bx + (Math.random() - 0.5) * 10, player.y + (Math.random() - 0.5) * 10);
    }
  }

  // While darting, use less friction so speed carries
  const activeFriction = player.dartTimer > 0 ? 0.97 : friction;
  player.vx *= activeFriction;
  player.vy *= activeFriction;

  // Speed cap (higher during dart)
  const dartMaxSpeed = player.dartTimer > 0 ? maxSpeed * 2.5 : maxSpeed;
  const speed = Math.sqrt(player.vx * player.vx + player.vy * player.vy);
  if (speed > dartMaxSpeed) {
    player.vx = (player.vx / speed) * dartMaxSpeed;
    player.vy = (player.vy / speed) * dartMaxSpeed;
  }

  player.x += player.vx;
  player.y += player.vy;

  // Boundaries
  const hw = player.width / 2;
  const hh = player.height / 2;
  if (player.x < hw) { player.x = hw; player.vx *= -0.5; }
  if (player.x > GW - hw) { player.x = GW - hw; player.vx *= -0.5; }
  if (player.y < hh + 10) { player.y = hh + 10; player.vy *= -0.5; }
  if (player.y > GH - 55 - hh) { player.y = GH - 55 - hh; player.vy *= -0.5; }

  if (player.invincible > 0) player.invincible--;

  // Bubble trail (more frequent while darting)
  const bubbleRate = player.dartTimer > 0 ? 3 : 15;
  if (frameCount % bubbleRate === 0 && (Math.abs(player.vx) > 0.5 || Math.abs(player.vy) > 0.5)) {
    const bx = player.facingLeft ? player.x + hw : player.x - hw;
    spawnBubble(bx, player.y);
    if (Math.random() < 0.3) sfxBubble();
  }
}

function updateEnemies() {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    // Frozen state
    if (e.frozenTimer > 0) {
      e.frozenTimer--;
      e.vx *= 0.9;
      e.vy *= 0.9;
      e.x += e.vx;
      e.y += e.vy;
      // Still remove if off screen
      if ((e.vx > 0 && e.x > GW + 100) || (e.vx < 0 && e.x < -100)) {
        enemies.splice(i, 1);
      }
      continue;
    }

    // Enemy dart timer countdown
    if (e.dartTimer > 0) e.dartTimer--;

    // Random enemy dart — brief speed burst in their swim direction
    if (!e.dartTimer && Math.random() < DART_ENEMY_CHANCE) {
      const dir = e.vx >= 0 ? 1 : -1;
      e.vx += dir * DART_BOOST * 0.6;
      e.dartTimer = DART_DURATION;
      // Bubbles behind darting enemy
      const bx = dir < 0 ? e.x + e.width / 2 : e.x - e.width / 2;
      spawnBubble(bx, e.y);
    }

    // Less friction during dart, normal otherwise
    if (e.dartTimer > 0) {
      e.vx *= 0.97;
    }

    e.x += e.vx;
    e.y += e.vy;
    e.frame++;
    e.y += Math.sin(e.wobble + e.frame * 0.03) * 0.3;

    // Slight y drift toward center
    if (e.y < 40) e.vy += 0.01;
    if (e.y > GH - 80) e.vy -= 0.01;

    // Remove if off screen
    if ((e.vx > 0 && e.x > GW + 100) || (e.vx < 0 && e.x < -100)) {
      enemies.splice(i, 1);
      continue;
    }

    // Bubble trail for bigger fish
    if (e.type >= 3 && frameCount % 30 === 0) {
      spawnBubble(e.x, e.y - e.height / 4);
    }
  }

  // Spawn rate based on enemy count and level
  const maxEnemies = 8 + level * 2;
  if (enemies.length < maxEnemies && Math.random() < 0.02 + level * 0.005) {
    spawnEnemy();
  }
}

function checkCollisions() {
  if (player.invincible > 0) return;

  const px1 = player.x - player.width * 0.4;
  const py1 = player.y - player.height * 0.4;
  const px2 = player.x + player.width * 0.4;
  const py2 = player.y + player.height * 0.4;

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const ex1 = e.x - e.width * 0.4;
    const ey1 = e.y - e.height * 0.4;
    const ex2 = e.x + e.width * 0.4;
    const ey2 = e.y + e.height * 0.4;

    // AABB collision
    if (px1 < ex2 && px2 > ex1 && py1 < ey2 && py2 > ey1) {
      // Compare actual visual sizes to determine outcome
      const playerArea = player.width * player.height;
      const enemyArea = e.width * e.height;
      const sizeRatio = playerArea / enemyArea;

      if (sizeRatio > 1.15) {
        // Player is clearly bigger - eat the fish!
        eatFish(e, i);
      } else if (sizeRatio < 0.85) {
        if (starfishImmunityTimer > 0) {
          bounceFish(e);
        } else {
          playerDeath();
          return;
        }
      } else {
        // Similar size - bounce off each other!
        bounceFish(e);
      }
    }
  }

  // Shark collision
  if (shark.active) {
    const sx1 = shark.x - shark.width * 0.4;
    const sy1 = shark.y - shark.height * 0.35;
    const sx2 = shark.x + shark.width * 0.4;
    const sy2 = shark.y + shark.height * 0.35;

    if (px1 < sx2 && px2 > sx1 && py1 < sy2 && py2 > sy1) {
      // Check if player is in the tail zone (behind the shark)
      const tailZone = shark.facingLeft ?
        (player.x > shark.x + shark.width * 0.1) :
        (player.x < shark.x - shark.width * 0.1);
      if (tailZone) {
        // Player is at the tail - safe! Deal damage if cooldown allows
        if (shark.hitCooldown <= 0) {
          hitShark();
        }
        return; // Never die from tail contact
      }
      // Front/body collision - shark eats player (unless starfish shield)
      if (starfishImmunityTimer > 0) {
        const pushDx = player.x - shark.x;
        const pushDy = player.y - shark.y;
        const pushDist = Math.sqrt(pushDx * pushDx + pushDy * pushDy) || 1;
        player.vx += (pushDx / pushDist) * 5;
        player.vy += (pushDy / pushDist) * 5;
        sfxBounce();
      } else {
        playerDeath();
      }
    }
  }
}

function eatFish(e, index) {
  enemies.splice(index, 1);

  // Combo system
  comboCount++;
  comboTimer = 90; // 1.5 seconds
  const comboMultiplier = Math.min(comboCount, 5);
  const pts = e.points * comboMultiplier;
  score += pts;

  player.eatCount++;

  // Check for size up
  const nextSize = player.sizeLevel + 1;
  if (nextSize < SIZE_THRESHOLDS.length && player.eatCount >= SIZE_THRESHOLDS[nextSize]) {
    player.sizeLevel = nextSize;
    player.width = SIZE_DIMENSIONS[nextSize].w;
    player.height = SIZE_DIMENSIONS[nextSize].h;
    sfxGrow();
    levelUpTimer = 60;
    spawnEatParticles(player.x, player.y, '#FFD700');
    flashTimer = 20;

    // Level advances with every size-up (levels 1-7)
    level = nextSize + 1;

    // Cycle to next shanty
    currentShantyIndex = (currentShantyIndex + 1) % SHANTIES.length;
    if (musicPlaying && currentMusic === 'happy') {
      stopMusic();
      startMusic('happy');
    }

    // Bonus round every 5th level
    if (level % 5 === 0) {
      startBonusRound();
    }
  }

  // Effects
  sfxEat();
  const pal = FISH_PALETTES[e.colorIdx % FISH_PALETTES.length];
  spawnEatParticles(e.x, e.y, pal ? pal.md : '#FFFFFF');
  const comboText = comboMultiplier > 1 ? `+${pts} x${comboMultiplier}!` : `+${pts}`;
  spawnScorePopup(e.x, e.y - 20, comboText);
}

function bounceFish(e) {
  // Push player and enemy apart
  const dx = player.x - e.x;
  const dy = player.y - e.y;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const pushForce = 3.5;
  const nx = dx / dist;
  const ny = dy / dist;

  // Push player away
  player.vx = nx * pushForce;
  player.vy = ny * pushForce;

  // Push enemy away
  e.vx = -nx * pushForce * 0.5 + (e.vx > 0 ? 0.5 : -0.5);

  // Brief invincibility so they don't immediately re-collide
  player.invincible = 15;

  sfxBounce();
  spawnScorePopup(
    (player.x + e.x) / 2,
    (player.y + e.y) / 2 - 15,
    'BONK!'
  );
}

function hitShark() {
  // Damage scales with player size: bigger fish = more damage per bite
  // Size 0 = 1 dmg, Size 1 = 2, Size 2 = 3, Size 3 = 4, Size 4 = 6, Size 5 = 8
  const biteDamage = [1, 2, 3, 4, 6, 8][player.sizeLevel] || 1;
  shark.hp -= biteDamage;
  shark.hitCooldown = 60;
  spawnEatParticles(shark.x, shark.y, '#FF4444');
  sfxEat();

  // Track bites this patrol for power-up trigger
  sharkBitesThisPatrol++;
  if (sharkBitesThisPatrol === 3 && !powerUp.active && player.sizeLevel < 5) {
    spawnPowerUp();
  }

  if (shark.hp <= 0) {
    // Shark defeated!
    sharkDefeats++;
    const sharkPts = 1000 * level;
    score += sharkPts;
    spawnScorePopup(shark.x, shark.y - 30, `+${sharkPts} SHARK!`);
    spawnDeathParticles(shark.x, shark.y);
    sfxSharkDefeat();
    shark.active = false;
    sharkActive = false;
    sharkTimer = 800 + Math.random() * 400;
    startMusic('happy');
    flashTimer = 30;
  } else {
    spawnScorePopup(shark.x, shark.y - 20, `CHOMP! ${shark.hp} HP left`);
    // Extend shark stay by 5 seconds (36fps * 5) so player can keep fighting
    shark._stayTimer += 36 * 5;
    // If shark was exiting, pull it back to patrol
    if (shark.phase === 'exit') {
      shark.phase = 'patrol';
      const sharkSpeed = 0.75 + level * 0.075;
      shark.vx = shark.facingLeft ? -sharkSpeed : sharkSpeed;
      shark.vy = 0;
      shark.chargeTimer = 80 + Math.random() * 80;
    }
    // Shark speeds up slightly when hit
    shark.vx *= 1.15;
  }
}

// ============================================================
//  POWER-UP: Super Fishfood Jar
// ============================================================
function spawnPowerUp() {
  powerUp.active = true;
  // Random position away from screen edges and floor
  powerUp.x = 80 + Math.random() * (GW - 160);
  powerUp.y = 60 + Math.random() * (GH - 180);
  powerUp.bobOffset = Math.random() * Math.PI * 2;
  powerUp.sparkleTimer = 0;
}

function updatePowerUp() {
  if (!powerUp.active) return;
  powerUp.sparkleTimer++;
  // Sparkle particles
  if (powerUp.sparkleTimer % 12 === 0) {
    const sx = powerUp.x + (Math.random() - 0.5) * 30;
    const sy = powerUp.y + (Math.random() - 0.5) * 36;
    particles.push({
      type: 'sparkle', x: sx, y: sy,
      vx: (Math.random() - 0.5) * 1, vy: -0.5 - Math.random(),
      size: 2 + Math.random() * 3, life: 25, maxLife: 25,
      color: ['#FFD700', '#FFFFFF', '#FFAA00'][Math.floor(Math.random() * 3)],
      alpha: 1,
    });
  }
}

function checkPowerUpCollision() {
  if (!powerUp.active) return;
  const dx = player.x - powerUp.x;
  const dy = player.y - (powerUp.y + Math.sin(powerUp.bobOffset + frameCount * 0.05) * 4);
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < (player.width + powerUp.width) * 0.4) {
    collectPowerUp();
  }
}

function collectPowerUp() {
  powerUp.active = false;
  sfxPowerUp();
  spawnEatParticles(powerUp.x, powerUp.y, '#FFD700');
  spawnScorePopup(powerUp.x, powerUp.y - 20, 'SUPER GROW!');
  flashTimer = 20;

  // Grow player by 1 size level
  if (player.sizeLevel < 5) {
    player.sizeLevel++;
    player.width = SIZE_DIMENSIONS[player.sizeLevel].w;
    player.height = SIZE_DIMENSIONS[player.sizeLevel].h;
    player.eatCount = SIZE_THRESHOLDS[player.sizeLevel];
    sfxGrow();
    levelUpTimer = 60;
    spawnEatParticles(player.x, player.y, '#FFD700');
  }
}

// Starfish functions
function spawnStarfish() {
  if (starfish.active) return;
  starfish.active = true;
  const fromLeft = Math.random() < 0.5;
  starfish.x = fromLeft ? -20 : GW + 20;
  starfish.y = 60 + Math.random() * (GH - 180);
  starfish.vx = fromLeft ? 0.6 + Math.random() * 0.4 : -(0.6 + Math.random() * 0.4);
  starfish.bobOffset = Math.random() * Math.PI * 2;
}

function updateStarfish() {
  // Check if score crossed a new 2000-point threshold
  const threshold = Math.floor(score / 200) * 2000;
  if (threshold > 0 && threshold > lastStarfishScoreThreshold && !starfish.active && starfishImmunityTimer <= 0) {
    lastStarfishScoreThreshold = threshold;
    spawnStarfish();
  }

  if (starfish.active) {
    starfish.x += starfish.vx;
    starfish.y += Math.sin(starfish.bobOffset + frameCount * 0.03) * 0.4;
    // Remove if off screen
    if ((starfish.vx > 0 && starfish.x > GW + 40) || (starfish.vx < 0 && starfish.x < -40)) {
      starfish.active = false;
    }
  }

  if (starfishImmunityTimer > 0) starfishImmunityTimer--;
}

function checkStarfishCollision() {
  if (!starfish.active) return;
  const dx = player.x - starfish.x;
  const dy = player.y - starfish.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < (player.width + starfish.width) * 0.4) {
    collectStarfish();
  }
}

function collectStarfish() {
  starfish.active = false;
  sfxPowerUp();
  spawnEatParticles(starfish.x, starfish.y, '#F09A50');
  spawnScorePopup(starfish.x, starfish.y - 20, 'STARFISH SHIELD!');
  starfishImmunityTimer = STARFISH_IMMUNITY_DURATION;
  flashTimer = 20;
}

function drawStarfish() {
  if (!starfish.active) return;
  const bob = Math.sin(starfish.bobOffset + frameCount * 0.03) * 4;
  const px = starfish.x;
  const py = starfish.y + bob;

  // Glow
  ctx.save();
  ctx.globalAlpha = 0.2 + Math.sin(frameCount * 0.1) * 0.1;
  ctx.fillStyle = '#FFAA55';
  ctx.beginPath();
  ctx.arc(px, py, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Body — cached pixel sprite; arms flex over STAR_ANIM_FRAMES, no spin
  const spriteData = createStarfish(frameCount >> 1);
  const dw = starfish.width + 2;
  const dh = starfish.height + 2;
  ctx.drawImage(spriteData.canvas, px - dw / 2, py - dh / 2, dw, dh);

  // Floating arrow
  const arrowBob = Math.sin(frameCount * 0.12) * 3;
  ctx.fillStyle = '#FFAA55';
  ctx.beginPath();
  ctx.moveTo(px, py - 18 + arrowBob);
  ctx.lineTo(px - 4, py - 24 + arrowBob);
  ctx.lineTo(px + 4, py - 24 + arrowBob);
  ctx.fill();
}

function drawPowerUp() {
  if (!powerUp.active) return;
  const bob = Math.sin(powerUp.bobOffset + frameCount * 0.05) * 4;
  const px = powerUp.x;
  const py = powerUp.y + bob;
  const ps = 2;

  // Glow effect
  const glowAlpha = 0.15 + Math.sin(frameCount * 0.1) * 0.08;
  ctx.globalAlpha = glowAlpha;
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(px, py, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Jar body (glass)
  ctx.fillStyle = '#88CCEE';
  ctx.fillRect(px - 6 * ps, py - 4 * ps, 12 * ps, 10 * ps);
  // Glass highlight
  ctx.fillStyle = 'rgba(200,240,255,0.5)';
  ctx.fillRect(px - 5 * ps, py - 3 * ps, 2 * ps, 8 * ps);
  // Glass outline
  ctx.strokeStyle = '#336688';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(px - 6 * ps, py - 4 * ps, 12 * ps, 10 * ps);

  // Lid (gold)
  ctx.fillStyle = '#DAA520';
  ctx.fillRect(px - 7 * ps, py - 6 * ps, 14 * ps, 2 * ps);
  ctx.strokeStyle = '#8B6914';
  ctx.lineWidth = 1;
  ctx.strokeRect(px - 7 * ps, py - 6 * ps, 14 * ps, 2 * ps);

  // Lid knob
  ctx.fillStyle = '#FFD700';
  ctx.fillRect(px - 2 * ps, py - 7.5 * ps, 4 * ps, 2 * ps);

  // Fish food inside (colorful pellets)
  const pelletColors = ['#FF6644', '#FFAA22', '#FF4488', '#FF8833', '#FFCC11'];
  for (let i = 0; i < 8; i++) {
    const pelletX = px + (((i * 7 + 3) % 10) - 5) * ps * 0.8;
    const pelletY = py + (((i * 5 + 2) % 8) - 3) * ps * 0.7;
    ctx.fillStyle = pelletColors[i % pelletColors.length];
    ctx.beginPath();
    ctx.arc(pelletX, pelletY, ps * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // Label
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 8px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('SUPER', px, py + 3 * ps + 3);

  // Floating arrow indicator
  const arrowBob = Math.sin(frameCount * 0.12) * 3;
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.moveTo(px, py - 10 * ps + arrowBob);
  ctx.lineTo(px - 4, py - 12 * ps + arrowBob);
  ctx.lineTo(px + 4, py - 12 * ps + arrowBob);
  ctx.fill();
}

function playerDeath() {
  sfxDeath();
  spawnDeathParticles(player.x, player.y);
  lives--;
  gameState = STATE.DYING;
  dyingTimer = 90;
  stopMusic();
}

function respawnPlayer() {
  if (lives <= 0) {
    gameState = STATE.GAME_OVER;
    gameOverTimer = 120;
    // Check if score qualifies for leaderboard
    hsEntryRank = -1;
    for (let i = 0; i < leaderboard.length; i++) {
      if (score > leaderboard[i].score) {
        hsEntryRank = i;
        break;
      }
    }
    if (score > highScore) {
      highScore = score;
    }
    return;
  }
  gameState = STATE.PLAYING;
  player.x = GW / 2;
  player.y = GH / 2;
  player.vx = 0;
  player.vy = 0;
  player.invincible = 120;
  // Shrink down one size on death
  if (player.sizeLevel > 0) {
    player.sizeLevel--;
    player.width = SIZE_DIMENSIONS[player.sizeLevel].w;
    player.height = SIZE_DIMENSIONS[player.sizeLevel].h;
    player.eatCount = SIZE_THRESHOLDS[player.sizeLevel];
  }
  // Clear nearby enemies
  enemies = enemies.filter(e => {
    const dx = e.x - player.x;
    const dy = e.y - player.y;
    return Math.sqrt(dx * dx + dy * dy) > 150;
  });
  startMusic(sharkActive ? 'shark' : 'happy');
}

function updateShark() {
  if (!shark.active) {
    sharkTimer--;
    if (sharkTimer <= 0 && gameState === STATE.PLAYING) {
      activateShark();
    }
    return;
  }

  shark.hitCooldown = Math.max(0, shark.hitCooldown - 1);

  const sharkSpeed = 0.75 + level * 0.075;

  switch (shark.phase) {
    case 'enter': {
      // Swim in from side
      const targetY = player.y;
      shark.y += (targetY - shark.y) * 0.02;
      shark.x += shark.vx;
      const inBounds = shark.facingLeft ?
        shark.x < GW - 100 :
        shark.x > 100;
      if (inBounds) {
        shark.phase = 'patrol';
        shark.chargeTimer = 120 + Math.random() * 120;
      }
      break;
    }
    case 'patrol': {
      // Swim back and forth, loosely tracking player
      shark.x += shark.vx;
      shark.y += (player.y - shark.y) * 0.01;
      shark.y += Math.sin(frameCount * 0.03) * 0.5;

      // Turn at edges
      if (shark.x < 80) { shark.vx = Math.abs(shark.vx); shark.facingLeft = false; }
      if (shark.x > GW - 80) { shark.vx = -Math.abs(shark.vx); shark.facingLeft = true; }

      shark.chargeTimer--;
      if (shark.chargeTimer <= 0) {
        shark.phase = 'charge';
        shark.chargeTimer = 60;
        // Aim at player
        const dx = player.x - shark.x;
        const dy = player.y - shark.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        shark.vx = (dx / dist) * sharkSpeed * 1.25;
        shark.vy = (dy / dist) * sharkSpeed * 1.25;
        shark.facingLeft = dx < 0;
      }
      break;
    }
    case 'charge': {
      shark.x += shark.vx;
      shark.y += shark.vy;
      shark.chargeTimer--;

      // Eat any small fish in the way
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dx = e.x - shark.x;
        const dy = e.y - shark.y;
        if (Math.abs(dx) < 60 && Math.abs(dy) < 30) {
          enemies.splice(i, 1);
          spawnEatParticles(e.x, e.y, '#FF4444');
        }
      }

      if (shark.chargeTimer <= 0) {
        shark.phase = 'patrol';
        shark.chargeTimer = 100 + Math.random() * 100;
        shark.vx = shark.facingLeft ? -sharkSpeed : sharkSpeed;
        shark.vy = 0;
      }

      // Bounds
      if (shark.y < 30) shark.vy = Math.abs(shark.vy);
      if (shark.y > GH - 80) shark.vy = -Math.abs(shark.vy);
      if (shark.x < -200 || shark.x > GW + 200) {
        shark.phase = 'enter';
        shark.x = shark.x < 0 ? -120 : GW + 120;
      }
      break;
    }
  }

  // Bubble trail
  if (frameCount % 8 === 0) {
    const bx = shark.facingLeft ? shark.x + shark.width * 0.4 : shark.x - shark.width * 0.4;
    spawnBubble(bx, shark.y - 5);
  }

  // Shark leaves after a while - count down stay timer
  if (shark.phase !== 'exit') {
    shark._stayTimer = (shark._stayTimer || 0) - 1;
    if (shark._stayTimer <= 0) {
      // Begin exit: shark swims off to nearest side
      shark.phase = 'exit';
      const exitLeft = shark.x < GW / 2;
      shark.vx = exitLeft ? -2.0 : 2.0;
      shark.vy = 0;
      shark.facingLeft = exitLeft;
    }
  }

  // Exit phase: swim off screen then deactivate
  if (shark.phase === 'exit') {
    shark.x += shark.vx;
    shark.y += Math.sin(frameCount * 0.03) * 0.3; // gentle bobbing
    // Only deactivate once fully off screen
    if (shark.x < -shark.width && shark.vx < 0 || shark.x > GW + shark.width && shark.vx > 0) {
      shark.active = false;
      sharkActive = false;
      sharkTimer = 600 + Math.random() * 400;
      shark._stayTimer = 0;
      startMusic('happy');
    }
  }
}

function activateShark() {
  sharkBitesThisPatrol = 0;
  sharkActive = true;
  shark.active = true;
  shark.hp = 8 + level * 2;
  shark.hitCooldown = 0;
  // Stay timer in frames (36fps): base 15 seconds + 2 seconds per level
  shark._stayTimer = 36 * (15 + level * 2);

  const fromLeft = Math.random() > 0.5;
  shark.x = fromLeft ? -120 : GW + 120;
  shark.y = 60 + Math.random() * (GH - 180);
  shark.facingLeft = !fromLeft;
  shark.vx = fromLeft ? 1.0 : -1.0;
  shark.vy = 0;
  shark.phase = 'enter';

  sfxSharkWarning();
  startMusic('shark');
  flashTimer = 15;
}

let sizeMeterGrad = null;

function drawHUD() {
  // Score
  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score}`, 12, 24);

  // Sharks defeated
  ctx.fillStyle = '#AAAACC';
  ctx.font = '12px monospace';
  ctx.fillText(`SHARKS: ${sharkDefeats}`, 12, 40);

  // High score
  ctx.fillStyle = '#AAAACC';
  ctx.fillText(`HI: ${leaderboard[0].score}`, 12, 54);

  // Starfish immunity timer
  if (starfishImmunityTimer > 0) {
    const secs = Math.ceil(starfishImmunityTimer / 36);
    const blink = starfishImmunityTimer < 36 * 5 ? (frameCount % 10 < 5) : true;
    if (blink) {
      ctx.fillStyle = '#FFAA55';
      ctx.font = 'bold 12px monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`SHIELD: ${secs}s`, 12, 68);
    }
  }

  // Level
  ctx.fillStyle = '#FFDD44';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`LEVEL ${level}`, GW / 2, 24);

  // Size meter
  const meterX = GW / 2 - 50;
  const meterY = 30;
  const meterW = 100;
  const meterH = 8;
  ctx.fillStyle = '#1a2a4a';
  ctx.fillRect(meterX, meterY, meterW, meterH);
  const nextThresh = SIZE_THRESHOLDS[player.sizeLevel + 1] || SIZE_THRESHOLDS[player.sizeLevel];
  const currThresh = SIZE_THRESHOLDS[player.sizeLevel];
  const progress = player.sizeLevel >= 5 ? 1 :
    (player.eatCount - currThresh) / (nextThresh - currThresh);
  if (!sizeMeterGrad) {
    sizeMeterGrad = ctx.createLinearGradient(meterX, 0, meterX + meterW, 0);
    sizeMeterGrad.addColorStop(0, '#44FF44');
    sizeMeterGrad.addColorStop(1, '#FFDD00');
  }
  ctx.fillStyle = sizeMeterGrad;
  ctx.fillRect(meterX, meterY, meterW * Math.min(1, progress), meterH);
  ctx.strokeStyle = '#4a6a9a';
  ctx.lineWidth = 1;
  ctx.strokeRect(meterX, meterY, meterW, meterH);

  ctx.fillStyle = '#AADDFF';
  ctx.font = '10px monospace';
  ctx.fillText(`SIZE ${player.sizeLevel + 1}/6`, GW / 2, meterY + meterH + 12);

  // Lives
  ctx.textAlign = 'right';
  ctx.fillStyle = '#FF6666';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('\u2665 '.repeat(lives), GW - 12, 24);

  // Dart cooldown indicator
  const dartReady = player.dartCooldown <= 0;
  const dartBarX = GW - 80;
  const dartBarY = 32;
  const dartBarW = 66;
  const dartBarH = 6;
  ctx.fillStyle = '#1a2a4a';
  ctx.fillRect(dartBarX, dartBarY, dartBarW, dartBarH);
  if (dartReady) {
    ctx.fillStyle = '#44DDFF';
    ctx.fillRect(dartBarX, dartBarY, dartBarW, dartBarH);
  } else {
    const pct = 1 - player.dartCooldown / DART_COOLDOWN;
    ctx.fillStyle = '#226688';
    ctx.fillRect(dartBarX, dartBarY, dartBarW * pct, dartBarH);
  }
  ctx.strokeStyle = '#4a6a9a';
  ctx.lineWidth = 1;
  ctx.strokeRect(dartBarX, dartBarY, dartBarW, dartBarH);
  ctx.textAlign = 'right';
  ctx.fillStyle = dartReady ? '#44DDFF' : '#668899';
  ctx.font = '9px monospace';
  ctx.fillText(dartReady ? 'DART [SPACE]' : 'DART ...', GW - 12, dartBarY + dartBarH + 10);

  // Combo
  if (comboCount > 1 && comboTimer > 0) {
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,255,0,${comboTimer / 90})`;
    ctx.font = `bold ${14 + comboCount * 2}px monospace`;
    ctx.fillText(`COMBO x${Math.min(comboCount, 5)}!`, GW / 2, GH - 70);
  }

  // Shark warning
  if (sharkActive && shark.active) {
    const warningAlpha = 0.5 + Math.sin(frameCount * 0.15) * 0.3;
    ctx.fillStyle = `rgba(255,50,50,${warningAlpha})`;
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('SHARK! BITE ITS TAIL!', GW / 2, GH - 52);
  }

  // Music indicator
  ctx.textAlign = 'right';
  ctx.fillStyle = musicEnabled ? 'rgba(136,255,170,0.6)' : 'rgba(170,136,136,0.6)';
  ctx.font = '9px monospace';
  ctx.fillText(`${musicEnabled ? '♪' : 'X'} MUSIC [M]`, GW - 8, GH - 8);
}

function drawPlayer() {
  if (player.invincible > 0 && frameCount % 6 < 3) return; // Flash when invincible

  // Starfish immunity glow
  if (starfishImmunityTimer > 0) {
    const pulse = 0.3 + Math.sin(frameCount * 0.15) * 0.15;
    const glowSize = Math.max(player.width, player.height) * 0.75;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#FFAA55';
    ctx.shadowColor = '#FFAA55';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.ellipse(player.x, player.y, glowSize, glowSize * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  const sprite = createPlayerFish(player.sizeLevel, frameCount, player.facingLeft);

  // Brighten player during starfish immunity
  if (starfishImmunityTimer > 0) {
    ctx.save();
    ctx.drawImage(sprite,
      player.x - player.width / 2,
      player.y - player.height / 2,
      player.width,
      player.height
    );
    // Overlay bright tint
    ctx.globalAlpha = 0.25 + Math.sin(frameCount * 0.12) * 0.1;
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = '#FFC58A';
    ctx.fillRect(
      player.x - player.width / 2,
      player.y - player.height / 2,
      player.width,
      player.height
    );
    ctx.restore();
  } else {
    ctx.drawImage(sprite,
      player.x - player.width / 2,
      player.y - player.height / 2,
      player.width,
      player.height
    );
  }

  if (playerFrozenTimer > 0) {
    drawFrozenEffect(player.x, player.y, player.width, player.height);
  }
}

function drawEnemies() {
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const spriteData = createEnemyFish(e.type, e.frame, e.facingLeft, e.colorIdx, e.patternIdx);
    ctx.drawImage(spriteData.canvas,
      e.x - e.width / 2,
      e.y - e.height / 2,
      e.width,
      e.height
    );
    if (e.frozenTimer > 0) {
      drawFrozenEffect(e.x, e.y, e.width, e.height);
    }
  }
}

function drawShark() {
  if (!shark.active) return;

  // Hit flash
  if (shark.hitCooldown > 50) {
    ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.8) * 0.5;
  }

  const spriteData = createShark(frameCount, shark.facingLeft, shark.phase === 'charge');
  ctx.drawImage(spriteData.canvas,
    shark.x - shark.width / 2,
    shark.y - shark.height / 2,
    shark.width,
    shark.height
  );
  ctx.globalAlpha = 1;

  // Shark HP bar
  if (shark.hp > 0) {
    const barW = 60;
    const barH = 5;
    const barX = shark.x - barW / 2;
    const barY = shark.y - shark.height / 2 - 12;
    ctx.fillStyle = '#440000';
    ctx.fillRect(barX, barY, barW, barH);
    const maxHp = 8 + level * 2;
    ctx.fillStyle = '#FF2222';
    ctx.fillRect(barX, barY, barW * (shark.hp / maxHp), barH);
    ctx.strokeStyle = '#880000';
    ctx.lineWidth = 1;
    ctx.strokeRect(barX, barY, barW, barH);
  }
}

function drawAmbientBubbles() {
  ctx.globalAlpha = 0.2;
  ctx.strokeStyle = '#88BBDD';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 0; i < ambientBubbles.length; i++) {
    const b = ambientBubbles[i];
    b.y -= b.speed;
    b.x += Math.sin(b.wobble + frameCount * 0.02) * 0.3;
    if (b.y < -10) {
      b.y = GH + 10;
      b.x = Math.random() * GW;
    }
    ctx.moveTo(b.x + b.size, b.y); // avoid joining the previous circle
    ctx.arc(b.x, b.y, b.size, 0, TAU);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawFlash() {
  if (flashTimer > 0) {
    ctx.globalAlpha = flashTimer / 30 * 0.3;
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, GW, GH);
    ctx.globalAlpha = 1;
    flashTimer--;
  }
}

function initDemo() {
  demoPlayer = { x: GW / 2, y: GH / 2, vx: 0, vy: 0, facingLeft: false, sizeLevel: 1, width: 40, height: 26 };
  demoEnemies = [];
  for (let i = 0; i < 6; i++) {
    const type = Math.floor(Math.random() * 4);
    const fromLeft = Math.random() < 0.5;
    const dims = SIZE_DIMENSIONS[type];
    demoEnemies.push({
      x: fromLeft ? -30 - Math.random() * 100 : GW + 30 + Math.random() * 100,
      y: 50 + Math.random() * (GH - 150),
      vx: (fromLeft ? 1 : -1) * (0.5 + Math.random() * 1.5),
      vy: 0,
      width: dims.w, height: dims.h,
      type: type,
      frame: Math.floor(Math.random() * 100),
      facingLeft: !fromLeft,
      colorIdx: Math.floor(Math.random() * FISH_PALETTES.length),
      patternIdx: Math.floor(Math.random() * FISH_MORPH_COUNT),
      wobble: Math.random() * Math.PI * 2,
    });
  }
  demoTargetX = GW / 2;
  demoTargetY = GH / 2;
}

function updateDemo() {
  // Pick a new target occasionally
  if (frameCount % 60 === 0) {
    demoTargetX = 80 + Math.random() * (GW - 160);
    demoTargetY = 60 + Math.random() * (GH - 160);
  }

  // Steer demo player toward target
  const dx = demoTargetX - demoPlayer.x;
  const dy = demoTargetY - demoPlayer.y;
  const accel = 0.3;
  if (Math.abs(dx) > 5) demoPlayer.vx += (dx > 0 ? accel : -accel);
  if (Math.abs(dy) > 5) demoPlayer.vy += (dy > 0 ? accel : -accel);
  demoPlayer.vx *= 0.94;
  demoPlayer.vy *= 0.94;
  demoPlayer.x += demoPlayer.vx;
  demoPlayer.y += demoPlayer.vy;
  if (demoPlayer.vx > 0.2) demoPlayer.facingLeft = false;
  else if (demoPlayer.vx < -0.2) demoPlayer.facingLeft = true;

  // Boundaries
  demoPlayer.x = Math.max(20, Math.min(GW - 20, demoPlayer.x));
  demoPlayer.y = Math.max(30, Math.min(GH - 70, demoPlayer.y));

  // Update demo enemies
  for (let i = demoEnemies.length - 1; i >= 0; i--) {
    const e = demoEnemies[i];
    e.x += e.vx;
    e.y += Math.sin(e.wobble + e.frame * 0.03) * 0.3;
    e.frame++;
    if ((e.vx > 0 && e.x > GW + 80) || (e.vx < 0 && e.x < -80)) {
      // Respawn
      const fromLeft = Math.random() < 0.5;
      e.x = fromLeft ? -40 : GW + 40;
      e.y = 50 + Math.random() * (GH - 150);
      e.vx = (fromLeft ? 1 : -1) * (0.5 + Math.random() * 1.5);
      e.facingLeft = !fromLeft;
      e.colorIdx = Math.floor(Math.random() * FISH_PALETTES.length);
    }
  }
}

  ctx.fillStyle = '#88BBDD';
  ctx.font = '16px monospace';
  ctx.fillText('CAN YOU DEFEAT SHARKY?', GW / 2, titleY + 85);

  // Instructions
  ctx.textAlign = 'center';
  ctx.fillStyle = '#AABBCC';
  ctx.font = '12px monospace';
  ctx.fillText('ARROWS/WASD: SWIM   SPACE: DART   M: MUSIC', GW / 2, 200);
  ctx.fillText('EAT SMALLER FISH \u2022 AVOID BIGGER FISH', GW / 2, 220);
  ctx.fillText('BITE THE SHARK\'S TAIL TO DEFEAT IT!', GW / 2, 240);
}

function drawGameOver() {
  // Darken
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, GW, GH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FF4444';
  ctx.font = 'bold 48px monospace';
  ctx.fillText('GAME OVER', GW / 2, 180);

  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 24px monospace';
  ctx.fillText(`FINAL SCORE: ${score}`, GW / 2, 240);

  ctx.fillStyle = '#AADDFF';
  ctx.font = '16px monospace';
  ctx.fillText(`LEVEL: ${level}  |  SHARKS DEFEATED: ${sharkDefeats}`, GW / 2, 280);

  if (hsEntryRank >= 0) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 20px monospace';
    const sparkle = Math.sin(frameCount * 0.15) > 0 ? ' \u2605' : ' \u2606';
    ctx.fillText(`TOP ${hsEntryRank + 1} SCORE!${sparkle}`, GW / 2, 320);
  }

  if (gameOverTimer <= 0) {
    const blink = Math.sin(frameCount * 0.08) > 0;
    if (blink) {
      ctx.fillStyle = '#FFDD44';
      ctx.font = 'bold 16px monospace';
      ctx.fillText('PRESS ANY KEY TO CONTINUE', GW / 2, 370);
    }
  }
}

function drawHighScoreEntry() {
  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(0, 0, GW, GH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#FFD700';
  ctx.font = 'bold 32px monospace';
  ctx.fillText('HIGH SCORE!', GW / 2, 60);

  ctx.fillStyle = '#FFFFFF';
  ctx.font = 'bold 20px monospace';
  ctx.fillText(`SCORE: ${score}`, GW / 2, 95);

  ctx.fillStyle = '#AADDFF';
  ctx.font = '16px monospace';
  ctx.fillText('ENTER YOUR INITIALS', GW / 2, 130);

  // Draw the 3 letter slots
  const slotW = 40;
  const slotGap = 12;
  const startX = GW / 2 - (slotW * 3 + slotGap * 2) / 2;
  const slotY = 150;

  for (let i = 0; i < 3; i++) {
    const sx = startX + i * (slotW + slotGap);
    const isActive = i === hsEntryPos;

    // Slot background
    ctx.fillStyle = isActive ? 'rgba(255,215,0,0.3)' : 'rgba(255,255,255,0.1)';
    ctx.fillRect(sx, slotY, slotW, 48);
    ctx.strokeStyle = isActive ? '#FFD700' : '#556688';
    ctx.lineWidth = isActive ? 2 : 1;
    ctx.strokeRect(sx, slotY, slotW, 48);

    // Letter
    ctx.fillStyle = isActive ? '#FFD700' : '#FFFFFF';
    ctx.font = 'bold 30px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(hsEntryInitials[i], sx + slotW / 2, slotY + 36);

    // Up/down arrows for active slot
    if (isActive) {
      const arrowBob = Math.sin(frameCount * 0.15) * 2;
      ctx.fillStyle = '#FFD700';
      ctx.font = '14px monospace';
      ctx.fillText('\u25B2', sx + slotW / 2, slotY - 4 + arrowBob);
      ctx.fillText('\u25BC', sx + slotW / 2, slotY + 64 - arrowBob);
    }
  }

  ctx.fillStyle = '#88AACC';
  ctx.font = '11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('\u2190 \u2192 MOVE   \u2191 \u2193 CHANGE   TYPE LETTERS   ENTER TO CONFIRM', GW / 2, 228);

  // Draw leaderboard with the new entry highlighted
  drawLeaderboardTable(250, hsEntryRank);
}

function drawLeaderboardTable(topY, highlightRank) {
  ctx.textAlign = 'center';
  ctx.fillStyle = '#88BBDD';
  ctx.font = 'bold 16px monospace';
  ctx.fillText('TOP 10', GW / 2, topY);

  const rowH = 18;
  const startY = topY + 20;

  for (let i = 0; i < leaderboard.length; i++) {
    const entry = leaderboard[i];
    const y = startY + i * rowH;
    const isHighlight = i === highlightRank;

    if (isHighlight) {
      const pulse = 0.6 + Math.sin(frameCount * 0.12) * 0.3;
      ctx.fillStyle = `rgba(255,215,0,${pulse})`;
    } else {
      ctx.fillStyle = i < 3 ? '#FFD700' : '#AABBCC';
    }
    ctx.font = isHighlight ? 'bold 13px monospace' : '13px monospace';

    const rank = `${i + 1}.`.padStart(3);
    const name = isHighlight && highlightRank >= 0 && gameState === STATE.HIGH_SCORE_ENTRY
      ? hsEntryInitials.join('')
      : entry.name;
    const scoreStr = entry.score.toString().padStart(6);
    ctx.textAlign = 'center';
    ctx.fillText(`${rank} ${name}  ${scoreStr}`, GW / 2, y);
  }
}

function drawLevelUpEffect() {
  if (levelUpTimer > 0) {
    const alpha = levelUpTimer / 60;
    ctx.textAlign = 'center';
    ctx.fillStyle = `rgba(255,215,0,${alpha})`;
    ctx.font = `bold ${24 + (60 - levelUpTimer) * 0.5}px monospace`;
    ctx.fillText('SIZE UP!', GW / 2, GH / 2 - 40);
    ctx.font = '14px monospace';
    ctx.fillStyle = `rgba(170,220,255,${alpha})`;
    ctx.fillText(`\u266B ${SHANTIES[currentShantyIndex % SHANTIES.length].name}`, GW / 2, GH / 2 - 15);
    levelUpTimer--;
  }
}

// ============================================================
//  MAIN GAME LOOP
// ============================================================
function update() {
  frameCount++;

  switch (gameState) {
    case STATE.TITLE:
      attractTimer++;
      if (attractTimer >= ATTRACT_PHASE_DURATION) {
        attractTimer = 0;
        attractPhase = (attractPhase + 1) % 3;
        if (attractPhase === 2) initDemo();
      }
      if (attractPhase === 2) updateDemo();
      break;

    case STATE.PLAYING:
      updatePlayer();
      updateEnemies();
      updateShark();
      checkCollisions();
      updatePowerUp();
      checkPowerUpCollision();
      updateStarfish();
      checkStarfishCollision();
      updateEels();

      // Combo decay
      if (comboTimer > 0) {
        comboTimer--;
        if (comboTimer <= 0) comboCount = 0;
      }
      break;

    case STATE.DYING:
      dyingTimer--;
      updateParticles();
      if (dyingTimer <= 0) {
        respawnPlayer();
      }
      return; // Skip normal render, handle below

    case STATE.BONUS:
      updateBonusRound();
      break;

    case STATE.GAME_OVER:
      if (gameOverTimer > 0) gameOverTimer--;
      break;
  }
}

function render() {
  // Background — regenerate when level changes (deeper = darker navy)
  if (!bgCanvas || bgLevel !== level) createBackground();

  if (gameState === STATE.TITLE) {
    // Attract mode screens draw their own backgrounds
    if (attractPhase === 0) {
      drawTitleScreen();
    } else if (attractPhase === 1) {
      drawHighScoreScreen();
    } else {
      drawDemo();
    }
    drawAttractPressKey();
    return;
  }

  if (gameState === STATE.BONUS) {
    drawBonusRound();
    return;
  }

  ctx.drawImage(bgCanvas, 0, 0);
  drawCaustics();
  drawAmbientBubbles();

  switch (gameState) {

    case STATE.PLAYING:
    case STATE.DYING:
      drawEnemies();
      drawEels();
      drawShark();
      drawPowerUp();
      drawStarfish();
      if (gameState !== STATE.DYING) drawPlayer();
      updateParticles();
      drawParticles();
      drawFlash();
      drawLevelUpEffect();
      drawHUD();
      break;

    case STATE.GAME_OVER:
      drawEnemies();
      drawShark();
      updateParticles();
      drawParticles();
      drawHUD();
      drawGameOver();
      break;

    case STATE.HIGH_SCORE_ENTRY:
      drawHighScoreEntry();
      break;

    case STATE.BONUS:
      drawBonusRound();
      break;
  }
}

// Fixed timestep: update at 36fps while rendering every frame
const TARGET_UPDATE_MS = 1000 / 36; // ~28ms per update tick
const MAX_UPDATES_PER_FRAME = 5;    // cap catch-up so a throttled raf can't run the game in slow motion
let lastTime = 0;
let accumulator = 0;

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  accumulator += timestamp - lastTime;
  lastTime = timestamp;

  let updates = 0;
  while (accumulator >= TARGET_UPDATE_MS && updates < MAX_UPDATES_PER_FRAME) {
    update();
    accumulator -= TARGET_UPDATE_MS;
    updates++;
  }
  // Drop any remaining backlog — better to skip game time than run in slow-mo or spiral.
  if (accumulator > TARGET_UPDATE_MS * MAX_UPDATES_PER_FRAME) {
    accumulator = 0;
  }

  render();
  requestAnimationFrame(gameLoop);
}

// Reset timing when returning to a backgrounded tab so we don't try to catch up over a multi-second gap.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    lastTime = 0;
    accumulator = 0;
  }
});

// Initialize
createBackground();
requestAnimationFrame(gameLoop);

</script>
